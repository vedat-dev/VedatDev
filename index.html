<style>
/* ONLINE DICE */
#onlineDice{width:min(390px,96vw);left:50%;top:50%;transform:translate(-50%,-50%)}
#onlineDice .content{padding:12px}
.dice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 14px}
.dice{
 height:100px;border:4px solid;border-color:#fff #555 #555 #fff;
 display:flex;align-items:center;justify-content:center;
 border-radius:5px;position:relative;
}
.dice-face{display:grid;grid-template-columns:repeat(3,10px);grid-template-rows:repeat(3,10px);gap:5px}
.dice-dot{width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:1px 1px #333}
.dice.green{background:#159447}
.dice.blue{background:#1765bb}
.dice.yellow{background:#e5c52a}
.dice.orange{background:#e87924}
.dice-label{position:absolute;bottom:5px;right:6px;color:#fff;font-size:6px}
.dice-reroll{width:100%;font-size:10px;padding:12px;margin-bottom:12px}
.dice-panel{background:#b5b5b5;border:3px inset #ddd;padding:10px;margin-top:10px}
.dice-panel-title{text-align:center;margin-bottom:10px;line-height:1.8}
.counter-number{font-family:monospace;font-size:27px;font-weight:bold;text-align:center;background:#111;color:#42ff42;padding:8px;margin-bottom:9px}
.counter-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.counter-controls button{padding:8px 2px;font-size:7px}
.counter-reset{width:100%;margin-top:6px}
.coin-area{display:flex;align-items:center;justify-content:center;gap:16px}
.coin{
 width:76px;height:76px;border-radius:50%;
 border:5px solid #76520c;background:linear-gradient(135deg,#ffe875,#c58b14);
 display:flex;align-items:center;justify-content:center;
 color:#493000;font-size:8px;font-weight:bold;
 box-shadow:3px 3px #555;
}
.coin-result{min-width:75px;text-align:center;line-height:2}
.coin-flip{margin-top:10px;width:100%}
</style>

<template id="iconDice">
<svg viewBox="0 0 40 36">
 <rect x="2" y="3" width="16" height="16" fill="#159447" stroke="#fff" stroke-width="2"/>
 <rect x="22" y="3" width="16" height="16" fill="#1765bb" stroke="#fff" stroke-width="2"/>
 <rect x="2" y="21" width="16" height="13" fill="#e5c52a" stroke="#fff" stroke-width="2"/>
 <rect x="22" y="21" width="16" height="13" fill="#e87924" stroke="#fff" stroke-width="2"/>
 <g fill="#fff"><circle cx="7" cy="8" r="2"/><circle cx="13" cy="14" r="2"/><circle cx="27" cy="8" r="2"/><circle cx="33" cy="14" r="2"/><circle cx="7" cy="26" r="2"/><circle cx="27" cy="26" r="2"/></g>
</svg>
</template>

<script>
/* Add the Online Dice desktop icon */
const desktop=document.querySelector('.desktop');
const diceIcon=document.createElement('div');
diceIcon.className='deskicon';
diceIcon.innerHTML='<span class="pixel-icon" data-icon="iconDice"></span><span>ONLINE DICE</span>';
diceIcon.onclick=()=>openApp('onlineDice');
desktop.appendChild(diceIcon);

const diceTemplate=document.getElementById('iconDice');
diceIcon.querySelector('[data-icon]').appendChild(diceTemplate.content.cloneNode(true));

/* Add Start menu entry */
const menuList=document.querySelector('.menu-list');
const diceMenu=document.createElement('div');
diceMenu.className='menu-item';
diceMenu.innerHTML='<span class="pixel-icon"></span>ONLINE DICE';
diceMenu.querySelector('.pixel-icon').appendChild(diceTemplate.content.cloneNode(true));
diceMenu.onclick=()=>{openApp('onlineDice');toggleMenu()};
menuList.insertBefore(diceMenu,menuList.querySelector('hr'));

/* Add taskbar button */
const taskButtons=document.querySelector('.task-buttons');
const diceTask=document.createElement('button');
diceTask.className='taskbtn';
diceTask.textContent='DICE';
diceTask.onclick=()=>openApp('onlineDice');
taskButtons.appendChild(diceTask);

/* Create Online Dice window */
const diceWindow=document.createElement('div');
diceWindow.className='window';
diceWindow.id='onlineDice';
diceWindow.innerHTML=`
 <div class="titlebar" onpointerdown="startDrag(event,'onlineDice')">
  <div class="title-name">
   <span class="title-icon" id="diceTitleIcon"></span>ONLINE DICE.EXE
  </div>
  <div class="title-actions">
   <button onclick="minimizeApp('onlineDice')">_</button>
   <button onclick="closeApp('onlineDice')">×</button>
  </div>
 </div>
 <div class="content">
  <div class="dice-grid">
   <div class="dice green" id="dice0"></div>
   <div class="dice blue" id="dice1"></div>
   <div class="dice yellow" id="dice2"></div>
   <div class="dice orange" id="dice3"></div>
  </div>
  <button class="dice-reroll" onclick="rollOnlineDice()">REROLL</button>

  <div class="dice-panel">
   <div class="dice-panel-title">WIN / LOSS COUNTER</div>
   <div class="row" style="gap:8px">
    <div style="flex:1">
     <div class="small center">WINS</div>
     <div class="counter-number" id="diceWins">0</div>
    </div>
    <div style="flex:1">
     <div class="small center">LOSSES</div>
     <div class="counter-number" id="diceLosses">0</div>
    </div>
   </div>
   <div class="small center" style="margin:8px 0">SELECT COUNTER</div>
   <select id="diceCounterSelect" style="width:100%;margin-bottom:8px">
    <option value="wins">WINS</option>
    <option value="losses">LOSSES</option>
   </select>
   <div class="counter-controls">
    <button onclick="changeDiceCounter(1)">+1</button>
    <button onclick="changeDiceCounter(10)">+10</button>
    <button onclick="changeDiceCounter(-1)">−1</button>
    <button onclick="changeDiceCounter(-10)">−10</button>
   </div>
   <button class="counter-reset" onclick="resetDiceCounters()">RESET</button>
  </div>

  <div class="dice-panel">
   <div class="dice-panel-title">COIN FLIP</div>
   <div class="coin-area">
    <div class="coin" id="diceCoin">COIN</div>
    <div class="coin-result" id="diceCoinResult">READY</div>
   </div>
   <button class="coin-flip" onclick="flipOnlineCoin()">FLIP COIN</button>
  </div>
 </div>
`;
document.body.insertBefore(diceWindow,document.querySelector('.taskbar'));

document.getElementById('diceTitleIcon').appendChild(diceTemplate.content.cloneNode(true));

/* Dice logic */
const onlineDiceValues=[1,2,3,4];

function drawOnlineDie(index,value){
 const die=document.getElementById('dice'+index);
 const positions={
  1:[4],
  2:[0,8],
  3:[0,4,8],
  4:[0,2,6,8],
  5:[0,2,4,6,8],
  6:[0,2,3,5,6,8]
 };
 die.innerHTML='';
 const face=document.createElement('div');
 face.className='dice-face';
 for(let i=0;i<9;i++){
  const dot=document.createElement('span');
  if(positions[value].includes(i))dot.className='dice-dot';
  face.appendChild(dot);
 }
 const label=document.createElement('span');
 label.className='dice-label';
 label.textContent=value;
 die.append(face,label);
}
function rollOnlineDice(){
 for(let i=0;i<4;i++){
  onlineDiceValues[i]=Math.floor(Math.random()*6)+1;
  drawOnlineDie(i,onlineDiceValues[i]);
 }
 playTone(650,.08);
}
function changeDiceCounter(amount){
 const type=document.getElementById('diceCounterSelect').value;
 const el=document.getElementById(type==='wins'?'diceWins':'diceLosses');
 const next=Math.max(0,Number(el.textContent)+amount);
 el.textContent=next;
 playTone(500,.04);
}
function resetDiceCounters(){
 document.getElementById('diceWins').textContent='0';
 document.getElementById('diceLosses').textContent='0';
 playTone(300,.08);
}

/* Coin flip */
function flipOnlineCoin(){
 const heads=Math.random()<.5;
 const coin=document.getElementById('diceCoin');
 const result=document.getElementById('diceCoinResult');
 coin.textContent=heads?'HEADS':'TAILS';
 result.textContent=heads?'HEADS':'TAILS';
 coin.style.background=heads
  ?'linear-gradient(135deg,#ffe875,#c58b14)'
  :'linear-gradient(135deg,#d8d8d8,#777)';
 playTone(heads?700:400,.12);
}

/* Initial display */
rollOnlineDice();
</script>
