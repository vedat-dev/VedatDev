<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCloud Account Generator Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .search-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .search-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    .results-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-item {
      background-color: #f9f9fb;
      border: 1px solid #e5e5ea;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.15s ease;
    }

    .result-item:hover {
      background-color: #f0f0f5;
    }

    .email-address {
      font-size: 15px;
      font-weight: 500;
      color: #1d1d1f;
      word-break: break-all;
    }

    .creation-badge {
      background-color: #0071e3;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      margin-left: 12px;
    }

    .no-results {
      text-align: center;
      color: #86868b;
      font-size: 14px;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <div class="search-card">
    <h2>iCloud Search</h2>
    <div class="input-wrapper">
      <input type="text" id="searchInput" placeholder="Enter name or email (e.g. Leondrit@icloud.com)..." autocomplete="off">
    </div>
    <ul class="results-list" id="resultsList"></ul>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');

    // List of custom variations to append to the base username
    const numberVariations = ['12', '01', '88', '99', '2026', '_official', 'x'];

    searchInput.addEventListener('input', function() {
      const rawInput = this.value.trim().toLowerCase();
      resultsList.innerHTML = ''; // Clear current display

      if (!rawInput) return;

      // Extract only the username portion before '@'
      let baseName = rawInput.split('@')[0];
      
      // Clean special characters except numbers and letters
      baseName = baseName.replace(/[^a-z0-9._-]/g, '');

      if (!baseName) return;

      // Build initial list starting with exact match
      const generatedResults = [
        { email: `${baseName}@icloud.com`, count: 1 }
      ];

      // Add variation patterns with calculated mock creation counts
      numberVariations.forEach((suffix, index) => {
        generatedResults.push({
          email: `${baseName}${suffix}@icloud.com`,
          count: (index + 1) * 4
        });
      });

      // Render items to DOM
      generatedResults.forEach(item => {
        const li = document.createElement('li');
        li.className = 'result-item';

        li.innerHTML = `
          <span class="email-address">${item.email}</span>
          <span class="creation-badge">${item.count} made</span>
        `;

        resultsList.appendChild(li);
      });
    });
  </script>

</body>
</html>
