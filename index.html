<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Dice</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,#173d70 0%,transparent 45%),
        linear-gradient(180deg,#061a35,#020b18);
    font-family:Arial,sans-serif;
    color:white;
}

.app{
    width:min(780px,94%);
    margin:auto;
    padding:28px 0 45px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
}

.subtitle{
    margin-top:5px;
    color:#6682a8;
    font-size:10px;
    letter-spacing:2px;
}

/* SECRET COLOR BUTTON */

.secret-color{
    font-size:8px;
    color:#354b68;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.secret-color:hover{
    color:#7893b8;
}

#secretColor{
    font-weight:bold;
}

/* PANEL */

.panel{
    background:rgba(5,19,39,.94);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

/* FOUR SMALL BOXES */

.dice-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.dice-box{
    height:105px;
    border-radius:16px;
    background:#16304f;
    border:2px solid white;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    transition:.25s;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.25),
        0 8px 20px rgba(0,0,0,.25);
}

/* WHITE DOT IN CENTER */

.dice-box::after{
    content:"";
    position:absolute;

    width:13px;
    height:13px;

    background:white;
    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 10px rgba(255,255,255,.9);
}

/* COLOR NAME */

.color-name{
    position:absolute;
    bottom:9px;

    font-size:8px;
    font-weight:900;
    letter-spacing:1px;

    text-shadow:0 1px 5px rgba(0,0,0,.8);

    z-index:2;
}

/* ROLL ANIMATION */

.rolling{
    animation:shake .11s infinite;
}

@keyframes shake{
    0%{transform:rotate(-2deg) scale(1)}
    50%{transform:rotate(2deg) scale(1.03)}
    100%{transform:rotate(-2deg) scale(1)}
}

/* REROLL */

.reroll{
    width:100%;
    margin-top:20px;

    padding:16px;

    border:2px solid #fff1a6;
    border-radius:14px;

    background:#fff0a3;
    color:#182033;

    font-size:16px;
    font-weight:900;
    letter-spacing:2px;

    cursor:pointer;

    transition:.2s;
}

.reroll:hover{
    background:#fff6bf;
    transform:translateY(-2px);
}

.reroll:active{
    transform:scale(.98);
}

/* STATUS */

.status{
    text-align:center;
    color:#7189a8;
    font-size:11px;
    margin-top:15px;
}

.status strong{
    color:white;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:20px;
}

.stat{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    padding:12px;
}

.stat-title{
    color:#58708f;
    font-size:8px;
    letter-spacing:1px;
}

.stat-value{
    margin-top:5px;
    font-size:12px;
    font-weight:bold;
}

/* HISTORY */

.history-title{
    margin-top:25px;
    margin-bottom:9px;
    color:#6d86a5;
    font-size:10px;
    letter-spacing:1px;
}

.history{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.history-item{
    min-width:58px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    font-size:8px;
    font-weight:bold;

    border:1px solid rgba(255,255,255,.4);
}

/* MOBILE */

@media(max-width:600px){

    .app{
        width:94%;
        padding-top:20px;
    }

    .logo{
        font-size:22px;
    }

    .panel{
        padding:15px;
    }

    .dice-grid{
        gap:7px;
    }

    .dice-box{
        height:82px;
        border-radius:13px;
    }

    .dice-box::after{
        width:10px;
        height:10px;
    }

    .color-name{
        font-size:6px;
        bottom:7px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div>
            <div class="logo">ONLINE DICE</div>
            <div class="subtitle">COLOR ROLL SYSTEM</div>
        </div>

        <!-- TAP THIS TEXT TO CHANGE SECRET COLOR -->
        <div
            class="secret-color"
            onclick="changeSecretColor()"
        >
            COLOR:
            <span id="secretColor">GREEN</span>
        </div>

    </div>


    <div class="panel">

        <!-- FOUR SMALL COLOR BOXES -->

        <div class="dice-grid">

            <div class="dice-box" id="box0">
                <div class="color-name">READY</div>
            </div>

            <div class="dice-box" id="box1">
                <div class="color-name">READY</div>
            </div>

            <div class="dice-box" id="box2">
                <div class="color-name">READY</div>
            </div>

            <div class="dice-box" id="box3">
                <div class="color-name">READY</div>
            </div>

        </div>


        <button
            class="reroll"
            onclick="reroll()"
        >
            REROLL
        </button>


        <div class="status" id="status">
            Ready to roll
        </div>


        <div class="stats">

            <div class="stat">
                <div class="stat-title">
                    TOTAL ROLLS
                </div>

                <div
                    class="stat-value"
                    id="totalRolls"
                >
                    0
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    LAST COLORS
                </div>

                <div
                    class="stat-value"
                    id="lastColors"
                >
                    —
                </div>
            </div>


            <div class="stat">
                <div class="stat-title">
                    SECRET COLOR
                </div>

                <div
                    class="stat-value"
                    id="secretStat"
                >
                    GREEN
                </div>
            </div>

        </div>


        <div class="history-title">
            RECENT RESULTS
        </div>

        <div
            class="history"
            id="history"
        >
            <span style="color:#4d6280;font-size:9px;">
                No rolls yet
            </span>
        </div>

    </div>

</div>


<script>

/* COLORS */

const colors = [

    {
        name:"GREEN",
        hex:"#22c55e"
    },

    {
        name:"BLUE",
        hex:"#3b82f6"
    },

    {
        name:"YELLOW",
        hex:"#eab308"
    },

    {
        name:"ORANGE",
        hex:"#f97316"
    },

    {
        name:"PURPLE",
        hex:"#a855f7"
    },

    {
        name:"RED",
        hex:"#ef4444"
    }

];


let secretIndex = 0;

let totalRolls = 0;

let rolling = false;

let history = [];


const boxes = [

    document.getElementById("box0"),
    document.getElementById("box1"),
    document.getElementById("box2"),
    document.getElementById("box3")

];


/* CHANGE SECRET COLOR BY TAPPING TEXT */

function changeSecretColor(){

    secretIndex++;

    if(secretIndex >= colors.length){
        secretIndex = 0;
    }

    const color =
        colors[secretIndex];

    document.getElementById(
        "secretColor"
    ).innerText =
        color.name;

    document.getElementById(
        "secretColor"
    ).style.color =
        color.hex;

    document.getElementById(
        "secretStat"
    ).innerText =
        color.name;

}


/* GET A RANDOM COLOR
   EXCLUDING SECRET COLOR */

function getRandomColor(){

    const available =
        colors.filter(
            (_,index) =>
                index !== secretIndex
        );

    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];

}


/* REROLL */

function reroll(){

    if(rolling) return;

    rolling = true;

    totalRolls++;

    document.getElementById(
        "totalRolls"
    ).innerText =
        totalRolls;

    document.getElementById(
        "status"
    ).innerHTML =
        "<strong>ROLLING...</strong>";


    boxes.forEach(
        box => {

            box.classList.add(
                "rolling"
            );

        }
    );


    let time = 0;


    const animation =
        setInterval(() => {

            boxes.forEach(
                box => {

                    const color =
                        getRandomColor();

                    box.style.background =
                        color.hex;

                    box.querySelector(
                        ".color-name"
                    ).innerText =
                        color.name;

                }
            );


            time += 100;


            if(time >= 900){

                clearInterval(
                    animation
                );

                finishRoll();

            }

        },100);

}


/* FINAL RESULT */

function finishRoll(){

    const results = [];


    boxes.forEach(
        box => {

            const color =
                getRandomColor();

            results.push(color);


            box.classList.remove(
                "rolling"
            );


            box.style.background =
                color.hex;


            /* KEEP OUTLINE WHITE */

            box.style.borderColor =
                "white";


            box.querySelector(
                ".color-name"
            ).innerText =
                color.name;

        }
    );


    const names =
        results.map(
            color => color.name
        );


    document.getElementById(
        "lastColors"
    ).innerText =
        names.join(" • ");


    document.getElementById(
        "status"
    ).innerHTML =
        "Results: <strong>" +
        names.join(" • ") +
        "</strong>";


    addHistory(results);

    rolling = false;

}


/* HISTORY */

function addHistory(results){

    results.forEach(
        color => {

            history.unshift(
                color
            );

        }
    );


    if(history.length > 20){
        history.length = 20;
    }


    const historyBox =
        document.getElementById(
            "history"
        );


    historyBox.innerHTML = "";


    history.forEach(
        color => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.innerText =
                color.name;

            item.style.background =
                color.hex;

            item.style.color =
                color.name === "YELLOW"
                ? "#111"
                : "white";

            historyBox.appendChild(
                item
            );

        }
    );

}


/* INITIAL SECRET COLOR */

document.getElementById(
    "secretColor"
).style.color =
    colors[0].hex;

</script>

</body>
</html>
