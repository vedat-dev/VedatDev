<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Profile Checker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #161b22;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      border: 4px solid #30363d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 14px;
      color: #58a6ff;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 2px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #238636;
      color: white;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
    }

    .results {
      margin-top: 20px;
      text-align: left;
      font-size: 9px;
      line-height: 1.8;
      background: #0d1117;
      padding: 16px;
      border: 2px solid #30363d;
      display: none;
    }

    .results span {
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>ROBLOX PROFILE CHECKER</h2>
    <input type="text" id="usernameInput" placeholder="Enter Username...">
    <button onclick="checkProfile()">SEARCH PROFILE</button>

    <div id="resultsBox" class="results"></div>
  </div>

  <script>
    async function checkProfile() {
      const username = document.getElementById('usernameInput').value.trim();
      const resultsBox = document.getElementById('resultsBox');

      if (!username) {
        alert("Please enter a Roblox username!");
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "Fetching profile data...";

      try {
        // 1. Get User ID & Join Date
        const proxy = "https://corsproxy.io/?";
        const userReq = await fetch(proxy + encodeURIComponent("https://users.roblox.com/v1/usernames/users"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        });
        const userData = await userReq.json();

        if (!userData.data || userData.data.length === 0) {
          resultsBox.innerHTML = "<span style='color:#f85149'>User not found.</span>";
          return;
        }

        const userId = userData.data[0].id;
        const displayName = userData.data[0].displayName;

        // 2. Fetch Detailed Info (Creation Date)
        const detailsReq = await fetch(proxy + encodeURIComponent(`https://users.roblox.com/v1/users/${userId}`));
        const detailsData = await detailsReq.json();
        const createdDate = new Date(detailsData.created).toLocaleDateString();

        // 3. Fetch Presence (Last Online)
        const presenceReq = await fetch(proxy + encodeURIComponent("https://presence.roblox.com/v1/presence/users"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userIds: [userId] })
        });
        const presenceData = await presenceReq.json();
        const lastOnline = presenceData.userPresences[0]?.lastOnline ? new Date(presenceData.userPresences[0].lastOnline).toLocaleString() : "Hidden/Private";

        // Display results
        resultsBox.innerHTML = `
          <strong>Username:</strong> <span>${userData.data[0].name}</span><br>
          <strong>Display Name:</strong> <span>${displayName}</span><br>
          <strong>User ID:</strong> <span>${userId}</span><br>
          <strong>Account Created:</strong> <span>${createdDate}</span><br>
          <strong>Last Online:</strong> <span>${lastOnline}</span><br>
          <strong>Inventory RAP:</strong> <span>Requires Rolimons API integration or public inventory permissions</span>
        `;
      } catch (err) {
        resultsBox.innerHTML = "<span style='color:#f85149'>Error fetching data. Try again later.</span>";
      }
    }
  </script>

</body>
</html>
