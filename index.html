<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Key Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #161b22;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .key-box {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 16px;
      color: #58a6ff;
      margin: 15px 0;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Delta Key Access</h2>
    <p>Your access key has been generated below:</p>
    
    <div id="keyDisplay" class="key-box">Loading key...</div>
    
    <button onclick="copyKey()">Copy Key</button>
  </div>

  <script>
    // Generates a key based on today's date so it stays consistent
    const today = new Date().toISOString().slice(0,10);
    const generatedKey = "DELTA-KEY-" + btoa(today).substring(0, 8).toUpperCase();
    
    document.getElementById("keyDisplay").innerText = generatedKey;

    function copyKey() {
      navigator.clipboard.writeText(generatedKey);
      alert("Key copied to clipboard!");
    }
  </script>

</body>
</html>
