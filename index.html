<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Catalog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 0%, #1a1f2e 0%, #0a0e14 60%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px 14px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: #7b8494; margin-bottom: 16px; }

  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    width: 100%;
    max-width: 600px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: #161c29;
    color: #9ca3af;
    border: 1px solid #262e40;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .chip.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-color: transparent;
  }

  .catalog {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: #131824;
    border: 1px solid #232a3a;
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .card.hidden { display: none; }
  .card:hover { border-color: #333d54; }
  .card.playing { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8 inset; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-area { min-width: 0; flex: 1; }

  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title-text h3 { font-size: 15px; font-weight: 600; color: #f1f5f9; }

  .genre-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 11px;
    color: #5b6577;
  }
  .source-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    background: #1b2130;
    color: #7b8494;
    border: 1px solid #2a3141;
  }

  .desc-text {
    font-size: 12px;
    color: #8b93a3;
    line-height: 1.4;
  }

  .id-code { font-family: monospace; font-size: 10px; color: #4b5567; }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0d1117;
    border: 1px solid #1e2532;
    padding: 8px 10px;
    border-radius: 12px;
  }

  .play-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #05070c;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }
  .play-btn:active { transform: scale(0.9); }

  .scrub-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }

  .scrubber {
    -webkit-appearance: none;
    width: 100%; height: 4px;
    border-radius: 2px;
    background: #232a3a;
    cursor: pointer;
  }
  .scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #38bdf8;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
  }

  .time-row { display: flex; justify-content: space-between; font-size: 10px; color: #5b6577; font-variant-numeric: tabular-nums; }

  .copy-btn {
    background: none;
    border: 1px solid #2a3141;
    color: #7b8494;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: #f1f5f9; border-color: #3b4254; }

  .rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #1e2532;
    padding-top: 9px;
  }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 18px; color: #2a3141; cursor: pointer; transition: color 0.1s ease, transform 0.1s ease; }
  .star:hover { transform: scale(1.15); }
  .star.active { color: #facc15; }
  .rating-text { font-size: 11px; color: #7b8494; font-weight: 500; }
</style>
</head>
<body>

  <div class="page-title">🎧 Sound Catalog</div>
  <div class="page-sub">Roblox audio IDs · tap play for preview audio</div>

  <div class="filter-row" id="filterRow"></div>
  <div class="catalog" id="soundCatalog"></div>

  <script>
    // Preview-only audio (stable, hotlinkable) — the real Roblox catalog IDs below
    // can't be streamed directly in a browser; use rbxassetid://<id> in Roblox Studio.
    const previewTracks = [
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    ];

    const genreColors = {
      "Contemporary Folk": "#f59e0b", "Rock": "#ef4444", "Hip-Hop": "#a855f7",
      "Easy Listening": "#22c55e", "Scores & Orchestral": "#6366f1", "Electronic": "#38bdf8",
      "Pop": "#ec4899", "Film Score": "#8b5cf6", "Phonk": "#f97316", "Indie": "#14b8a6",
      "Latin Dance Styles": "#eab308", "Africa": "#84cc16", "New Age": "#06b6d4",
      "Dance": "#d946ef", "Novelty": "#f43f5e"
    };

    const sounds = [
      { name:"Happy Song", id:"1843404009", genre:"Contemporary Folk", dur:"2:48", source:"APM", desc:"Bright lobby or social hub background" },
      { name:"See You In Hell", id:"1837853076", genre:"Rock", dur:"2:48", source:"APM", desc:"Boss fights or heavy action rounds" },
      { name:"All Dropping 8 Bit Beats", id:"9048375035", genre:"Hip-Hop", dur:"2:06", source:"APM", desc:"Retro arcade or fast obby lobby" },
      { name:"Time To Relax", id:"9044702906", genre:"Easy Listening", dur:"1:18", source:"APM", desc:"Idle games, cafes, chill hangouts" },
      { name:"Angel", id:"9039291153", genre:"Hip-Hop", dur:"1:40", source:"APM", desc:"Late-night hangouts and mellow RP" },
      { name:"Abyssal Plain (Cello Lead Version)", id:"9042861406", genre:"Scores & Orchestral", dur:"3:07", source:"APM", desc:"Dramatic intros and story scenes" },
      { name:"Speed Metal Overture", id:"9042370693", genre:"Rock", dur:"2:48", source:"APM", desc:"Racing, PvP, and intense rounds" },
      { name:"Stadium Rave (A)", id:"1846368080", genre:"Electronic", dur:"2:48", source:"APM", desc:"Party servers and hype lobbies" },
      { name:"Relaxed Scene", id:"1848354536", genre:"Pop", dur:"1:37", source:"APM", desc:"Tycoons, plazas, and background ambience" },
      { name:"Tears Of Sorrow", id:"1843286166", genre:"Film Score", dur:"2:03", source:"APM", desc:"Sad cutscenes and story beats" },
      { name:"Phonk Vol. I – Phonk't Out", id:"14145625743", genre:"Phonk", dur:"1:32", source:"APM", desc:"Drift, combat, and montage energy" },
      { name:"Caged Animal (a)", id:"9043754347", genre:"Rock", dur:"3:02", source:"APM", desc:"Chases and high-pressure action" },
      { name:"Tear It Up", id:"1842763322", genre:"Indie", dur:"2:42", source:"APM", desc:"Skate, parkour, or upbeat action" },
      { name:"Prima Bossa Nova", id:"1837070127", genre:"Latin Dance Styles", dur:"2:48", source:"APM", desc:"Beach maps, cafes, and easygoing spaces" },
      { name:"Close By Me", id:"109514126289079", genre:"Africa", dur:"2:43", source:"DistroKid", desc:"Social servers and warm world vibes" },
      { name:"Wind Chimes", id:"134467328946090", genre:"New Age", dur:"2:23", source:"DistroKid", desc:"Meditation rooms and calm zones" },
      { name:"RAVE OR DIE", id:"120127258775778", genre:"Dance", dur:"5:14", source:"DistroKid", desc:"Club maps and neon playlists" },
      { name:"A Little Lo-Fi to Get By", id:"135783618859432", genre:"Dance", dur:"2:59", source:"DistroKid", desc:"Study rooms and soft background music" },
      { name:"Hypnotize", id:"125206342817819", genre:"Pop", dur:"3:51", source:"DistroKid", desc:"Pop-forward social games and showcases" },
      { name:"New Year, New Hope", id:"74135194911709", genre:"Dance", dur:"3:25", source:"DistroKid", desc:"Celebration events and festive lobbies" },
      { name:"Memories", id:"84939136131158", genre:"Dance", dur:"4:34", source:"DistroKid", desc:"Drive maps and laid-back hangouts" },
      { name:"Infectious", id:"79451196298919", genre:"Dance", dur:"5:00", source:"DistroKid", desc:"High-energy race or lobby music" },
      { name:"I don't wanna love you", id:"90129203071000", genre:"Rock", dur:"4:32", source:"DistroKid", desc:"Alt story scenes or emo social spaces" },
      { name:"My Wi Funk (Dancer)", id:"113708275704036", genre:"Dance", dur:"2:01", source:"DistroKid", desc:"Dance floors and party moments" },
      { name:"Parry Gripp – Raining Tacos", id:"142376088", genre:"Novelty", dur:"—", source:"DistroKid", desc:"Meme moments and silly celebrations" }
    ].map((s, i) => ({ ...s, previewSrc: previewTracks[i % previewTracks.length] }));

    const genres = ["All", ...new Set(sounds.map(s => s.genre))];
    const filterRow = document.getElementById('filterRow');
    const container = document.getElementById('soundCatalog');
    let currentAudio = null, currentCard = null, currentBtn = null;
    let activeGenre = "All";

    function fmtTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    genres.forEach(g => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (g === "All" ? " active" : "");
      chip.innerText = g;
      chip.onclick = () => {
        activeGenre = g;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        document.querySelectorAll('.card').forEach(card => {
          card.classList.toggle('hidden', g !== "All" && card.dataset.genre !== g);
        });
      };
      filterRow.appendChild(chip);
    });

    sounds.forEach((sound, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.genre = sound.genre;
      const color = genreColors[sound.genre] || "#6366f1";

      card.innerHTML = `
        <div class="card-header">
          <div class="title-area">
            <div class="name-row">
              <div class="title-text"><h3>${sound.name}</h3></div>
              <span class="genre-tag" style="background:${color}22;color:${color}">${sound.genre}</span>
            </div>
            <div class="meta-row">
              <span class="source-badge">${sound.source}</span>
              <span>${sound.dur}</span>
              <span class="id-code">#${sound.id}</span>
            </div>
            <div class="desc-text">${sound.desc}</div>
          </div>
        </div>

        <div class="player-row">
          <button class="play-btn" id="play-btn-${index}" onclick="toggleAudio(${index})">▶</button>
          <div class="scrub-wrap">
            <input type="range" class="scrubber" id="scrubber-${index}" value="0" min="0" max="100" oninput="seekAudio(${index}, this.value)">
            <div class="time-row">
              <span id="cur-time-${index}">0:00</span>
              <span id="dur-time-${index}">0:00</span>
            </div>
          </div>
          <button class="copy-btn" onclick="copyId('${sound.id}', this)">Copy ID</button>
          <audio id="audio-${index}" src="${sound.previewSrc}" preload="none"></audio>
        </div>

        <div class="rating-row">
          <div class="stars" id="stars-${index}">
            ${[1,2,3,4,5].map(star => `<span class="star" onclick="rate(${index}, ${star})">&#9733;</span>`).join('')}
          </div>
          <span class="rating-text" id="rating-text-${index}">Unrated</span>
        </div>
      `;
      container.appendChild(card);

      const audio = card.querySelector(`#audio-${index}`);
      const scrubber = card.querySelector(`#scrubber-${index}`);
      const curTime = card.querySelector(`#cur-time-${index}`);
      const durTime = card.querySelector(`#dur-time-${index}`);

      audio.addEventListener('loadedmetadata', () => { durTime.innerText = fmtTime(audio.duration); });
      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          scrubber.value = (audio.currentTime / audio.duration) * 100;
          curTime.innerText = fmtTime(audio.currentTime);
        }
      });
      audio.addEventListener('ended', () => {
        document.getElementById(`play-btn-${index}`).innerText = "▶";
        scrubber.value = 0;
        curTime.innerText = "0:00";
        card.classList.remove('playing');
      });
      audio.addEventListener('error', () => {
        document.getElementById(`play-btn-${index}`).innerText = "⚠";
      });
    });

    function toggleAudio(index) {
      const audio = document.getElementById(`audio-${index}`);
      const btn = document.getElementById(`play-btn-${index}`);
      const card = audio.closest('.card');

      if (currentAudio && currentAudio !== audio) {
        currentAudio.pause();
        if (currentBtn) currentBtn.innerText = "▶";
        if (currentCard) currentCard.classList.remove('playing');
      }

      if (audio.paused) {
        audio.play().then(() => {
          btn.innerText = "⏸";
          card.classList.add('playing');
          currentAudio = audio; currentBtn = btn; currentCard = card;
        }).catch(() => { btn.innerText = "⚠"; });
      } else {
        audio.pause();
        btn.innerText = "▶";
        card.classList.remove('playing');
      }
    }

    function seekAudio(index, percent) {
      const audio = document.getElementById(`audio-${index}`);
      if (audio.duration) audio.currentTime = (percent / 100) * audio.duration;
    }

    function rate(soundIndex, rating) {
      const stars = document.getElementById(`stars-${soundIndex}`).querySelectorAll('.star');
      stars.forEach((star, idx) => star.classList.toggle('active', idx < rating));
      document.getElementById(`rating-text-${soundIndex}`).innerText = `${rating}/5`;
    }

    function copyId(id, btn) {
      navigator.clipboard.writeText(id);
      const original = btn.innerText;
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = original; }, 1200);
    }
  </script>
</body>
</html>
