<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Key System</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #161b22;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 90%;
      max-width: 380px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .key-box {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      color: #58a6ff;
      margin-top: 15px;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Delta Key Generator</h2>
    <p>Paste your Delta URL below to generate your key:</p>
    
    <input type="text" id="deltaUrl" placeholder="https://gateway.platoboost.com/a/8?id=...">
    <button onclick="generateKey()">Get Key</button>

    <div id="keyBox" class="key-box"></div>
  </div>

  <script>
    async function generateKey() {
      const urlInput = document.getElementById('deltaUrl').value.trim();
      const keyBox = document.getElementById('keyBox');

      if (!urlInput) {
        alert("Please paste your Delta link first!");
        return;
      }

      keyBox.style.display = "block";
      keyBox.style.color = "#c9d1d9";
      keyBox.innerText = "Bypassing & Generating Key...";

      try {
        // Fetches from the bypass API using your Delta link
        const response = await fetch(`https://api.bypass.vip/bypass?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (data.result || data.key) {
          const finalKey = data.result || data.key;
          keyBox.style.color = "#3fb950";
          keyBox.innerHTML = "<strong>Your Key:</strong><br>" + finalKey;
        } else {
          keyBox.style.color = "#f85149";
          keyBox.innerText = "Failed to generate key. Ensure your Delta link is valid.";
        }
      } catch (error) {
        keyBox.style.color = "#f85149";
        keyBox.innerText = "Error connecting to service. Try again in a moment.";
      }
    }
  </script>

</body>
</html>
