<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Utilities & Profile Checker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #1a1e29;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 60px 15px 30px 15px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Top Left Nav Buttons */
    .top-left-nav {
      position: fixed;
      top: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    /* Top Right Nav Buttons */
    .top-right-nav {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .nav-btn {
      display: inline-block;
      padding: 8px 10px;
      border: 3px solid #000;
      background: #30363d;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 4px 0 #0d1117;
      transition: transform 0.1s, background 0.1s;
    }

    .nav-btn:hover {
      background: #484f58;
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d1117;
    }

    .nav-btn-app {
      background: #8957e5;
      box-shadow: 0 4px 0 #5a32a3;
    }

    .nav-btn-app:hover {
      background: #9e6af3;
    }

    .nav-btn-app:active {
      box-shadow: 0 2px 0 #5a32a3;
    }

    .nav-btn-discord {
      background: #5865F2;
      box-shadow: 0 4px 0 #3b42a0;
    }

    .nav-btn-discord:hover {
      background: #7983f5;
    }

    .nav-btn-discord:active {
      box-shadow: 0 2px 0 #3b42a0;
    }

    /* Animated Canvas Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .card {
      background: rgba(22, 27, 34, 0.95);
      padding: 18px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 4px solid #000;
      box-shadow: 
        inset 0 4px 0 #30363d,
        inset 0 -4px 0 #0d1117,
        0 8px 16px rgba(0,0,0,0.6);
      position: relative;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 10px;
      color: #58a6ff;
      margin: 15px 0;
      line-height: 1.4;
      text-shadow: 2px 2px 0px #000;
      letter-spacing: -1px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 3px solid #000;
      background: #0d1117;
      color: #3fb950;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      box-sizing: border-box;
      outline: none;
      box-shadow: inset 2px 2px 0 #000;
    }

    textarea {
      resize: vertical;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { box-shadow: 0 4px 0 #10421e, 0 0 5px rgba(35, 134, 54, 0.4); }
      50% { box-shadow: 0 4px 0 #10421e, 0 0 15px rgba(57, 211, 83, 0.8); }
      100% { box-shadow: 0 4px 0 #10421e, 0 0 5px rgba(35, 134, 54, 0.4); }
    }

    button {
      width: 100%;
      padding: 12px;
      border: 3px solid #000;
      background: #238636;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
      animation: pulse 2s infinite;
      box-sizing: border-box;
      transition: transform 0.1s;
      margin-bottom: 8px;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #10421e;
    }

    .btn-secondary {
      background: #1f6beb;
      animation: none;
      box-shadow: 0 4px 0 #0d419d;
    }

    .btn-secondary:active {
      box-shadow: 0 2px 0 #0d419d;
    }

    .profile-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: 3px solid #000;
      background: #1f6beb;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      text-align: center;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
      box-sizing: border-box;
      box-shadow: 0 4px 0 #0d419d;
      transition: transform 0.1s;
    }

    .profile-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d419d;
    }

    .results {
      margin-top: 15px;
      text-align: left;
      font-size: 8px;
      line-height: 2;
      background: #0d1117;
      padding: 12px;
      border: 3px solid #000;
      box-shadow: inset 2px 2px 0 #000;
      display: none;
    }

    .avatar-container {
      position: relative;
      width: 90px;
      margin: 0 auto 12px auto;
      text-align: center;
    }

    .avatar-img {
      width: 90px;
      height: 90px;
      display: block;
      border: 3px solid #30363d;
      background: #161b22;
      image-rendering: pixelated;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 7px;
      border: 2px solid #000;
      margin-top: 4px;
    }

    .status-online { background: #238636; color: #fff; }
    .status-offline { background: #da3633; color: #fff; }
    .status-ingame { background: #8957e5; color: #fff; }

    .results span {
      color: #58a6ff;
      word-break: break-all;
    }

    .results .rap-text {
      color: #f1e05a;
      text-shadow: 1px 1px 0 #000;
    }

    /* Item List Styling */
    .item-list-container {
      margin-top: 10px;
      border-top: 2px dashed #30363d;
      padding-top: 8px;
    }

    .item-list-title {
      color: #58a6ff;
      font-size: 7px;
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
    }

    .item-scroll-box {
      max-height: 120px;
      overflow-y: auto;
      background: #161b22;
      border: 2px solid #000;
      padding: 6px;
    }

    /* Custom Scrollbar */
    .item-scroll-box::-webkit-scrollbar, textarea::-webkit-scrollbar {
      width: 6px;
    }
    .item-scroll-box::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track {
      background: #0d1117;
    }
    .item-scroll-box::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb {
      background: #30363d;
      border: 1px solid #000;
    }

    .item-entry {
      font-size: 7px;
      line-height: 1.6;
      padding: 4px 0;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .item-entry:last-child {
      border-bottom: none;
    }

    .item-name {
      color: #c9d1d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .item-rap {
      color: #3fb950;
      flex-shrink: 0;
    }
    
    .loading {
      color: #c9d1d9;
      font-size: 8px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Left Links -->
  <div class="top-left-nav">
    <a href="https://www.roblox.com" target="_blank" class="nav-btn">ROBLOX.COM</a>
    <a href="https://apps.apple.com/us/app/roblox/id431946152" target="_blank" class="nav-btn nav-btn-app">ROBLOX APP</a>
  </div>

  <!-- Top Right Links -->
  <div class="top-right-nav">
    <a href="https://discord.gg/d5c62Hpvu" target="_blank" class="nav-btn nav-btn-discord">DISCORD</a>
  </div>

  <canvas id="bgCanvas"></canvas>

  <!-- 1. Profile & RAP Checker -->
  <div class="card">
    <h2>ROBLOX PROFILE CHECKER</h2>
    <input type="text" id="usernameInput" placeholder="USERNAME...">
    <button onclick="checkProfile()">SEARCH PROFILE</button>
    <div id="loadingStatus" class="loading">LOADING...</div>
    <div id="resultsBox" class="results"></div>
  </div>

  <!-- 2. Roblox Game Launcher -->
  <div class="card">
    <h2>GAME LAUNCHER & CHECKER</h2>
    <input type="text" id="placeIdInput" placeholder="PLACE ID OR GAME LINK...">
    <button onclick="launchRobloxGame()">LAUNCH VIA CLIENT</button>
    <button class="btn-secondary" onclick="checkGameInfo()">CHECK GAME LINK</button>
    <div id="robloxStatus" class="results"></div>
  </div>

  <!-- 3. Universal Script Deobfuscator Engine -->
  <div class="card">
    <h2>SCRIPT DEOBFUSCATOR</h2>
    <textarea id="deobfInput" rows="6" placeholder="PASTE OBFUSCATED SCRIPT HERE..."></textarea>
    <button onclick="processObfuscatedCode()">DEOBFUSCATE SCRIPT</button>

    <div style="margin-top: 10px; text-align: left;">
      <span class="item-list-title">CLEAN OUTPUT:</span>
      <textarea id="deobfOutput" rows="8" readonly placeholder="TRANSLATED SCRIPT WILL APPEAR HERE..."></textarea>
    </div>
  </div>

  <script>
    // --- Canvas Animated Pixel Stars Background ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createStars();
    }

    function createStars() {
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() > 0.8 ? 4 : 2,
          speed: 0.2 + Math.random() * 0.5,
          opacity: Math.random()
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        ctx.fillStyle = `rgba(88, 166, 255, ${star.opacity})`;
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.y -= star.speed;
        if (star.y < 0) star.y = canvas.height;
      });
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();

    // --- Audio Sound Effect Setup ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- Profile Fetcher Function ---
    async function checkProfile() {
      playBeep();
      const username = document.getElementById('usernameInput').value.trim();
      const resultsBox = document.getElementById('resultsBox');
      const loadingStatus = document.getElementById('loadingStatus');

      if (!username) {
        alert("ENTER A USERNAME!");
        return;
      }

      resultsBox.style.display = "none";
      loadingStatus.style.display = "block";
      loadingStatus.innerHTML = "FETCHING USER...";

      try {
        const proxy = "https://corsproxy.io/?";

        // 1. Resolve User ID
        const userReq = await fetch(proxy + encodeURIComponent("https://users.roblox.com/v1/usernames/users"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
        });
        const userData = await userReq.json();

        if (!userData.data || userData.data.length === 0) {
          throw new Error("USER NOT FOUND.");
        }

        const userId = userData.data[0].id;
        const displayName = userData.data[0].displayName;

        // 2. Avatar Thumbnail
        const avatarReq = await fetch(proxy + encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`));
        const avatarData = await avatarReq.json();
        const avatarUrl = avatarData.data[0]?.imageUrl || "";

        // 3. User Details & Age Calculation
        const detailsReq = await fetch(proxy + encodeURIComponent(`https://users.roblox.com/v1/users/${userId}`));
        const detailsData = await detailsReq.json();
        const createdDateObj = new Date(detailsData.created);
        const createdDate = createdDateObj.toLocaleDateString();

        const diffTime = Math.abs(new Date() - createdDateObj);
        const accountAgeDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        // 4. Presence Status
        const presenceReq = await fetch(proxy + encodeURIComponent("https://presence.roblox.com/v1/presence/users"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userIds: [userId] })
        });
        const presenceData = await presenceReq.json();
        
        const presenceType = presenceData.userPresences[0]?.userPresenceType || 0;
        let statusText = "OFFLINE";
        let statusClass = "status-offline";

        if (presenceType === 1) {
          statusText = "ONLINE";
          statusClass = "status-online";
        } else if (presenceType === 2) {
          statusText = "IN-GAME";
          statusClass = "status-ingame";
        }

        // 5. RAP & Inventory Collectibles Fetcher
        loadingStatus.innerHTML = "CALCULATING RAP...";
        let totalRAP = 0;
        let limitedCount = 0;
        let rapStatusMessage = "";
        let collectedItems = [];

        try {
          let cursor = "";
          let hasNextPage = true;

          while (hasNextPage) {
            const inventoryUrl = `https://inventory.roblox.com/v1/users/${userId}/assets/collectibles?sortOrder=Asc&limit=100` + (cursor ? `&cursor=${cursor}` : '');
            const invReq = await fetch(proxy + encodeURIComponent(inventoryUrl));
            
            if (invReq.status === 403) {
              rapStatusMessage = "PRIVATE INVENTORY";
              break;
            }

            const invData = await invReq.json();

            if (invData.data && invData.data.length > 0) {
              invData.data.forEach(item => {
                const rapVal = item.recentAveragePrice || 0;
                totalRAP += rapVal;
                limitedCount++;
                collectedItems.push({
                  name: item.name || "Unknown Item",
                  rap: rapVal
                });
              });
            }

            if (invData.nextPageCursor) {
              cursor = invData.nextPageCursor;
            } else {
              hasNextPage = false;
            }
          }

          if (!rapStatusMessage) {
            rapStatusMessage = `${totalRAP.toLocaleString()} R$ (${limitedCount} ITEMS)`;
          }
        } catch (e) {
          rapStatusMessage = "UNABLE TO FETCH";
        }

        let itemsListHtml = "";
        if (collectedItems.length > 0) {
          itemsListHtml = `
            <div class="item-list-container">
              <span class="item-list-title">RAP ITEM LIST:</span>
              <div class="item-scroll-box">
                ${collectedItems.map(item => `
                  <div class="item-entry">
                    <span class="item-name" title="${item.name}">${item.name}</span>
                    <span class="item-rap">${item.rap.toLocaleString()} R$</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        loadingStatus.style.display = "none";
        resultsBox.style.display = "block";
        resultsBox.innerHTML = `
          <div class="avatar-container">
            ${avatarUrl ? `<img src="${avatarUrl}" class="avatar-img" alt="Avatar">` : ''}
            <div class="status-badge ${statusClass}">${statusText}</div>
          </div>
          <strong>USER:</strong> <span>${userData.data[0].name}</span><br>
          <strong>DISPLAY:</strong> <span>${displayName}</span><br>
          <strong>ID:</strong> <span>${userId}</span><br>
          <strong>JOINED:</strong> <span>${createdDate}</span><br>
          <strong>ACCOUNT AGE:</strong> <span>${accountAgeDays} DAYS</span><br>
          <strong>EST. RAP:</strong> <span class="rap-text">${rapStatusMessage}</span><br>
          ${itemsListHtml}
          <a href="https://www.roblox.com/users/${userId}/profile" target="_blank" class="profile-btn">VIEW PROFILE</a>
        `;

      } catch (err) {
        loadingStatus.style.display = "none";
        resultsBox.style.display = "block";
        resultsBox.innerHTML = `<span style='color:#f85149'>ERROR: ${err.message}</span>`;
      }
    }

    // --- Roblox Launcher Logic ---
    function extractPlaceId(input) {
      const match = input.match(/\d+/);
      return match ? match[0] : null;
    }

    function launchRobloxGame() {
      playBeep();
      const rawInput = document.getElementById('placeIdInput').value.trim();
      const placeId = extractPlaceId(rawInput);
      const statusBox = document.getElementById('robloxStatus');
      statusBox.style.display = 'block';

      if (!placeId) {
        statusBox.innerHTML = '<span style="color: #da3633;">ERROR: INVALID PLACE ID.</span>';
        return;
      }

      statusBox.innerHTML = `<span style="color: #3fb950;">LAUNCHING PLACE ID ${placeId}...</span>`;
      window.location.href = `roblox://experiences/start?placeId=${placeId}`;
    }

    function checkGameInfo() {
      playBeep();
      const rawInput = document.getElementById('placeIdInput').value.trim();
      const placeId = extractPlaceId(rawInput);
      const statusBox = document.getElementById('robloxStatus');
      statusBox.style.display = 'block';

      if (!placeId) {
        statusBox.innerHTML = '<span style="color: #da3633;">ERROR: INVALID PLACE ID.</span>';
        return;
      }

      statusBox.innerHTML = `<strong>PLACE ID:</strong> <span>${placeId}</span><br>` +
                            `<a href="https://www.roblox.com/games/${placeId}" target="_blank" class="profile-btn">OPEN GAME PAGE</a>`;
    }

    // --- Deobfuscator Engine Logic ---
    function processObfuscatedCode() {
      playBeep();
      let code = document.getElementById('deobfInput').value;
      if (!code.trim()) return;

      let previousCode = "";
      let maxPasses = 10;
      let currentPass = 0;

      while (code !== previousCode && currentPass < maxPasses) {
        previousCode = code;
        currentPass++;

        // 1. Convert Byte Escape Sequences (\104\101\108\108\111)
        code = code.replace(/(\\([0-9]{1,3}))+/g, (match) => {
          try {
            const bytes = match.split('\\').filter(Boolean);
            return bytes.map(b => String.fromCharCode(parseInt(b, 10))).join('');
          } catch (e) { return match; }
        });

        // 2. Convert Hex Escape Sequences (\x68\x65\x6c\x6c\x6f)
        code = code.replace(/(\\x[0-9a-fA-F]{2})+/g, (match) => {
          try {
            const hexes = match.split('\\x').filter(Boolean);
            return hexes.map(h => String.fromCharCode(parseInt(h, 16))).join('');
          } catch (e) { return match; }
        });

        // 3. Decode string.char(...) byte arrays
        code = code.replace(/string\.char\(([\d\s,]+)\)/gi, (match, byteList) => {
          try {
            const charCodes = byteList.split(',').map(n => parseInt(n.trim(), 10));
            const str = String.fromCharCode(...charCodes);
            return `"${str}"`;
          } catch (e) { return match; }
        });

        // 4. Evaluate math expressions
        code = code.replace(/\(\s*(0x[0-9a-fA-F]+|-?\d+)\s*([+\-*\/%])\s*(0x[0-9a-fA-F]+|-?\d+)\s*\)/g, (match, a, op, b) => {
          try {
            const numA = a.startsWith('0x') ? parseInt(a, 16) : parseInt(a, 10);
            const numB = b.startsWith('0x') ? parseInt(b, 16) : parseInt(b, 10);
            let result = 0;
            if (op === '+') result = numA + numB;
            if (op === '-') result = numA - numB;
            if (op === '*') result = numA * numB;
            if (op === '/' && numB !== 0) result = Math.floor(numA / numB);
            if (op === '%') result = numA % numB;
            return result.toString();
          } catch (e) { return match; }
        });

        // 5. Join split strings ("Hello " .. "World")
        code = code.replace(/"([^"\\]*)"\s*(\.\.|\+)\s*"([^"\\]*)"/g, '"$1$3"');
        code = code.replace(/'([^'\\]*)'\s*(\.\.|\+)\s*'([^'\\]*)'/g, "'$1$3'");

        // 6. Normalize obfuscated control flows
        code = code.replace(/while\s+true\s+do\s+if\s+.*?\s+then/gi, '-- [Control Flow Unrolled]\nif true then');
      }

      document.getElementById('deobfOutput').value = code;
    }
  </script>

</body>
</html>
