<!DOCTYPE html>
<html lang="en">

<title>Sound Catalog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(circle at 20% 0%, #1a1f2e 0%, #0a0e14 60%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px 14px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    position: relative;
    transition: background-image 0.4s ease;
  }

  /* dark scrim so text stays legible over any photo */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,7,12,0.55) 0%, rgba(5,7,12,0.75) 100%);
    z-index: 0;
    pointer-events: none;
  }

  .page-title, .page-sub, .filter-row, .catalog, .bg-btn, .bg-panel {
    position: relative;
    z-index: 1;
  }

  .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .page-sub { font-size: 13px; color: #b8c0cf; margin-bottom: 16px; }
