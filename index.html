<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Catalog & Ratings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BLOCKY BUTTON NAVIGATION */
    .nav-container {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 28px;
    }

    .btn-blocky {
      flex: 1;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      border: 4px solid #000000;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
      font-family: inherit;
    }

    .btn-sounds {
      background-color: #6366f1;
      box-shadow: 0px 6px 0px #000000;
    }

    .btn-sounds:hover {
      background-color: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0px 8px 0px #000000;
    }

    .btn-sounds:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #000000;
    }

    .btn-future {
      background-color: #334155;
      color: #94a3b8;
      box-shadow: 0px 6px 0px #000000;
    }

    .btn-future:hover {
      background-color: #475569;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0px 8px 0px #000000;
    }

    .btn-future:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #000000;
    }

    /* CATALOG & CARDS */
    .catalog {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: #161b22;
      border: 3px solid #000000;
      border-radius: 8px;
      box-shadow: 0px 5px 0px #000000;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-area h3 {
      font-size: 18px;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .id-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #0d1117;
      border: 2px solid #000000;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .id-code {
      font-family: monospace;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* BLOCKY BUTTONS */
    .btn-action {
      background-color: #38bdf8;
      color: #000000;
      border: 2px solid #000000;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0px 3px 0px #000000;
      transition: all 0.05s ease;
    }

    .btn-action:hover {
      background-color: #7dd3fc;
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 0px #000000;
    }

    /* INTERACTIVE LIKE BUTTON */
    .btn-like {
      background-color: #22c55e;
      color: #000000;
      border: 2px solid #000000;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0px 3px 0px #000000;
      transition: all 0.05s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-like:hover {
      background-color: #4ade80;
    }

    .btn-like:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 0px #000000;
    }

    .btn-like.liked {
      background-color: #15803d;
      color: #ffffff;
    }

    /* SOUND PLAYER & TRACK SCRUBBER */
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0d1117;
      border: 2px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .scrubber {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* STAR RATINGS */
    .rating-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #21262d;
      padding-top: 10px;
    }

    .stars {
      display: flex;
      gap: 4px;
    }

    .star {
      font-size: 22px;
      color: #30363d;
      cursor: pointer;
      transition: color 0.1s ease;
    }

    .star.active {
      color: #facc15;
    }

    .rating-text {
      font-size: 13px;
      color: #8b949e;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <button class="btn-blocky btn-sounds">Sounds</button>
    <button class="btn-blocky btn-future">Coming Soon</button>
  </div>

  <div class="catalog" id="soundCatalog"></div>

  <script>
    const sounds = [
      { name: "Morning Mood (Peer Gynt Suite)", id: "1846088038", likes: 1239620 },
      { name: "The Four Seasons - Spring (a)", id: "9045766074", likes: 1153562 },
      { name: "Classic Easter", id: "1836009208", likes: 1069720 },
      { name: "Science Mysteries", id: "1840776993", likes: 926481 },
      { name: "Noisestorm - Crab Rave", id: "5410086218", likes: 856453 },
      { name: "Paradise Falls", id: "1837879082", likes: 698026 },
      { name: "Life in an Elevator", id: "1841647093", likes: 653594 },
      { name: "Chill Jazz", id: "1845341094", likes: 551422 },
      { name: "Horror", id: "9039981149", likes: 502203 },
      { name: "Cool Vibes", id: "1840684529", likes: 502200 },
      { name: "Gymnopedie No. 1", id: "9045766377", likes: 446140 },
      { name: "Night Run", id: "9044545570", likes: 349678 },
      { name: "Lo-fi Chill A", id: "9043887091", likes: 338868 },
      { name: "HR - EEYUH!", id: "16190782181", likes: 329074 },
      { name: "Dion Timmer - Shiawase", id: "5409360995", likes: 296043 },
      { name: "Into The Forest", id: "1845497774", likes: 282630 },
      { name: "Happy Song", id: "1843404009", likes: 250354 },
      { name: "Bossa Me (a)", id: "1837768517", likes: 238423 },
      { name: "Stray", id: "120102995443063", likes: 229631 }
    ];

    const container = document.getElementById('soundCatalog');
    
    // Web Audio Engine
    let audioCtx = null;
    let playingIndex = null;
    let currentOsc = null;
    let currentGain = null;
    let isPlaying = false;
    let playbackTime = 0;
    let timerInterval = null;
    const trackDuration = 10; // 10-second track preview

    sounds.forEach((sound, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-header">
          <div class="title-area">
            <h3>${sound.name}</h3>
            <button class="btn-like" id="like-btn-${index}" onclick="toggleLike(${index})">
              👍 <span id="likes-count-${index}">${sound.likes.toLocaleString()}</span>
            </button>
          </div>
          <div class="id-box">
            <span class="id-code">${sound.id}</span>
            <button class="btn-action" onclick="copyId('${sound.id}', this)">Copy</button>
          </div>
        </div>

        <div class="player-row">
          <button class="btn-action play-btn" id="play-btn-${index}" onclick="toggleAudio(${index})">▶ Play</button>
          <input type="range" class="scrubber" id="scrubber-${index}" value="0" min="0" max="100" oninput="seekAudio(${index}, this.value)">
        </div>

        <div class="rating-row">
          <div class="stars" id="stars-${index}">
            ${[1, 2, 3, 4, 5].map(star => `<span class="star" onclick="rate(${index}, ${star})">&#9733;</span>`).join('')}
          </div>
          <span class="rating-text" id="rating-text-${index}">Rating: Unrated</span>
        </div>
      `;
      container.appendChild(card);
    });

    const userLikes = {};

    function toggleLike(index) {
      const sound = sounds[index];
      const countEl = document.getElementById(`likes-count-${index}`);
      const btnEl = document.getElementById(`like-btn-${index}`);

      if (!userLikes[index]) {
        userLikes[index] = true;
        sound.likes += 1;
        btnEl.classList.add('liked');
      } else {
        userLikes[index] = false;
        sound.likes -= 1;
        btnEl.classList.remove('liked');
      }

      countEl.innerText = sound.likes.toLocaleString();
    }

    function toggleAudio(index) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (playingIndex !== null && playingIndex !== index) {
        stopAudio(playingIndex);
      }

      if (playingIndex === index && isPlaying) {
        stopAudio(index);
      } else {
        startAudio(index);
      }
    }

    function startAudio(index) {
      playingIndex = index;
      isPlaying = true;
      
      const btn = document.getElementById(`play-btn-${index}`);
      btn.innerText = "⏸ Pause";

      const idDigits = sounds[index].id.split('').map(Number);
      
      currentOsc = audioCtx.createOscillator();
      currentGain = audioCtx.createGain();

      // Pitch calculation derived directly from ID digits
      const currentDigit = idDigits[Math.floor(playbackTime) % idDigits.length];
      const baseFreq = 220 + (currentDigit * 40);

      currentOsc.type = 'triangle';
      currentOsc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);

      currentGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

      currentOsc.connect(currentGain);
      currentGain.connect(audioCtx.destination);
      currentOsc.start();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        playbackTime += 0.1;
        const scrubber = document.getElementById(`scrubber-${index}`);
        scrubber.value = (playbackTime / trackDuration) * 100;

        // Modulate frequency across ID digits during playback
        if (currentOsc) {
          const digit = idDigits[Math.floor(playbackTime * 2) % idDigits.length];
          currentOsc.frequency.setValueAtTime(200 + (digit * 50), audioCtx.currentTime);
        }

        if (playbackTime >= trackDuration) {
          stopAudio(index);
          playbackTime = 0;
          scrubber.value = 0;
        }
      }, 100);
    }

    function stopAudio(index) {
      if (currentOsc) {
        currentOsc.stop();
        currentOsc.disconnect();
        currentOsc = null;
      }
      clearInterval(timerInterval);
      isPlaying = false;

      const btn = document.getElementById(`play-btn-${index}`);
      if (btn) btn.innerText = "▶ Play";
      playingIndex = null;
    }

    function seekAudio(index, percent) {
      playbackTime = (percent / 100) * trackDuration;
      if (playingIndex === index && isPlaying) {
        startAudio(index);
      }
    }

    function rate(soundIndex, rating) {
      const starContainer = document.getElementById(`stars-${soundIndex}`);
      const stars = starContainer.querySelectorAll('.star');
      
      stars.forEach((star, idx) => {
        if (idx < rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });

      document.getElementById(`rating-text-${soundIndex}`).innerText = `Your Rating: ${rating}/5`;
    }

    function copyId(id, btn) {
      navigator.clipboard.writeText(id);
      btn.innerText = "Copied!";
      setTimeout(() => {
        btn.innerText = "Copy";
      }, 1500);
    }
  </script>
</body>
</html>
