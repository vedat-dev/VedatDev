<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Catalog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-image: var(--bg-img);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px 14px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    transition: background-image 0.4s ease;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,7,12,0.55) 0%, rgba(5,7,12,0.75) 100%);
    z-index: 0;
    pointer-events: none;
  }
  .bg-btn, .coming-soon { position: relative; z-index: 1; }
  .bg-btn {
    position: fixed; top: 16px; right: 16px; z-index: 50;
    padding: 10px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: transform 0.15s ease, background 0.2s ease;
  }
  .bg-btn:active { transform: scale(0.94); }
  .bg-btn:hover { background: rgba(255,255,255,0.2); }
  .coming-soon {
    width: 100%; max-width: 420px; text-align: center;
    padding: 46px 28px; border-radius: 24px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 6px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .coming-soon .emoji { font-size: 40px; margin-bottom: 14px; }
  .coming-soon h2 {
    font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 8px;
    background: linear-gradient(135deg, #38bdf8, #8b5cf6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .coming-soon p { font-size: 13px; color: #b8c0cf; line-height: 1.5; }
</style>
</head>
<body>
  <button class="bg-btn" id="bgBtn" title="Change background">Photo 1</button>

  <div class="coming-soon">
    <div class="emoji">🎧</div>
    <h2>Coming Soon…</h2>
    <p>The sound catalog is being rebuilt. Check back shortly.</p>
  </div>

  <script>
    const photo1 = "url('data:image/jpeg;base64,PHOTO1_PLACEHOLDER')";
    const photo2 = "url('data:image/jpeg;base64,PHOTO2_PLACEHOLDER')";

    document.documentElement.style.setProperty('--bg-img', photo1);

    let onFirst = true;
    const bgBtn = document.getElementById('bgBtn');
    bgBtn.onclick = () => {
      onFirst = !onFirst;
      document.documentElement.style.setProperty('--bg-img', onFirst ? photo1 : photo2);
      bgBtn.innerText = onFirst ? "Photo 1" : "Photo 2";
    };
  </script>
</body>
</html>
