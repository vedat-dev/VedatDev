
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Classic Solitaire</title>
<style>
:root{
  --felt:#087342;
  --felt-dark:#055832;
  --gold:#ffd76a;
  --card-w:clamp(43px,9.2vw,94px);
  --card-h:calc(var(--card-w)*1.43);
  --gap:clamp(5px,1.3vw,13px);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#073e2a;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 15px;background:#10251d;
  border-bottom:2px solid #c6a65a;flex-wrap:wrap;
}
.brand{font-size:clamp(20px,4vw,29px);font-weight:bold;letter-spacing:2px}
.brand small{display:block;font:10px Arial,sans-serif;letter-spacing:3px;color:#d8c58d;margin-top:3px}
.stats{display:flex;gap:16px;font:12px Arial,sans-serif;color:#d8e9dc}
.stats strong{display:block;color:#fff;font-size:17px;margin-top:3px}
.controls{display:flex;gap:7px;flex-wrap:wrap}
.btn{
  border:1px solid #bfa35e;background:#1b392b;color:#fff;
  padding:9px 12px;border-radius:7px;font:12px Arial,sans-serif;
  transition:background .2s,transform .2s;
}
.btn:hover{background:#31543d}
.btn:active{transform:scale(.96)}
.btn.help{background:#e7bd52;color:#18271c;border-color:#ffe5a0;font-weight:bold}
main{
  max-width:1200px;margin:auto;padding:15px 10px 35px;
}
.table{
  min-height:calc(100vh - 135px);
  position:relative;padding:5px 3px 25px;
}
.top-row{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:var(--gap);margin-bottom:22px;
}
.top-left{grid-column:span 3;display:flex;gap:var(--gap)}
.slot{
  position:relative;width:var(--card-w);height:var(--card-h);
  flex:0 0 var(--card-w);border:1px solid #ffffff57;
  border-radius:7px;background:#ffffff0c;
}
.stock,.waste{width:var(--card-w);height:var(--card-h);position:relative;flex:0 0 var(--card-w)}
.foundation-area{grid-column:span 4;display:flex;justify-content:flex-end;gap:var(--gap)}
.slot .suit-mark{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#ffffff69;font-size:clamp(20px,5vw,38px);pointer-events:none;
}
.card{
  position:absolute;width:var(--card-w);height:var(--card-h);
  border-radius:7px;background:#fffdf5;color:#171717;
  border:1px solid #e4e0d5;
  box-shadow:0 2px 4px #001a1070;
  user-select:none;-webkit-user-select:none;
  cursor:pointer;touch-action:pan-y;
  transition:box-shadow .18s,filter .18s;
  overflow:hidden;
  animation:card-arrive .22s ease-out both;
}
@keyframes card-arrive{
  from{opacity:.3;transform:translateY(-10px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.card.red{color:#c62828}
.card .corner{
  position:absolute;top:3px;left:4px;
  font:bold clamp(11px,2.1vw,19px)/.9 Georgia,serif;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.card .corner.bottom{
  top:auto;left:auto;right:4px;bottom:3px;transform:rotate(180deg)
}
.card .corner .suit{font-size:.9em}
.card .pip{
  position:absolute;inset:20% 12% 20%;
  display:grid;place-items:center;font-size:clamp(19px,4.7vw,42px);
}
.card .face-art{
  position:absolute;inset:20% 12%;
  display:grid;place-items:center;
  font-size:clamp(19px,4vw,39px);
  border:2px double currentColor;border-radius:35%;
  background:linear-gradient(145deg,#f7e9c3,#fffdf6 55%,#d9c7a1);
}
.card .face-art span{filter:drop-shadow(0 1px 0 #fff)}
.card.back{
  border:3px solid #f5e9c9;
  background:
   repeating-linear-gradient(45deg,transparent 0 5px,#ffffff28 5px 7px),
   repeating-linear-gradient(-45deg,transparent 0 5px,#ffffff22 5px 7px),
   #183e70;
  box-shadow:inset 0 0 0 3px #183e70,inset 0 0 0 5px #d9c080,0 2px 4px #001a1070;
}
.card.back:after{
  content:"♠";position:absolute;inset:0;display:grid;place-items:center;
  color:#f4dfa2;font-size:clamp(24px,6vw,47px);text-shadow:0 1px 2px #001;
}
.card.selected{
  box-shadow:0 0 0 3px #ffe37a,0 0 18px #ffe37a;
  filter:brightness(1.05);
  z-index:20;
  animation:select-bounce .32s ease-out;
}
@keyframes select-bounce{
  0%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
  100%{transform:translateY(0)}
}
.card.hint-source{
  box-shadow:0 0 0 3px #ffe16a,0 0 22px #ffe16a;
  animation:hint-pulse .8s ease-in-out infinite alternate;
  z-index:30;
}
@keyframes hint-pulse{
  from{filter:brightness(1);box-shadow:0 0 0 2px #ffe16a,0 0 9px #ffe16a}
  to{filter:brightness(1.12);box-shadow:0 0 0 4px #fff4b0,0 0 24px #ffe16a}
}
.slot.hint-dest{
  border:3px solid #ffe16a;
  box-shadow:0 0 18px #ffe16a;
  animation:dest-pulse .8s ease-in-out infinite alternate;
  z-index:4;
}
@keyframes dest-pulse{
  from{background:#ffe16a17}
  to{background:#ffe16a45}
}
.tableau{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:var(--gap);align-items:start;
}
.pile{
  position:relative;min-width:0;min-height:var(--card-h);
}
.pile .slot{width:100%;height:var(--card-h)}
.pile .card{left:0;top:0}
.pile .card:not(:first-child){margin-top:0}
.empty-king{font-size:clamp(16px,4vw,30px);color:#ffffff55}
.status{
  min-height:37px;text-align:center;padding:12px 6px 5px;
  color:#e8e2c9;font:12px Arial,sans-serif;
}
#help-message{
  display:none;margin:4px auto 13px;max-width:500px;
  padding:10px 13px;border:1px solid #e6c45f;border-radius:8px;
  background:#102b1e;color:#fff0bd;text-align:center;
  font:13px/1.5 Arial,sans-serif;
}
#help-message.show{display:block;animation:message-in .2s ease-out}
@keyframes message-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
#arrow-layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000;overflow:visible}
.arrow-line{
  stroke:#ffe16a;stroke-width:4;fill:none;stroke-linecap:round;
  stroke-dasharray:10 7;filter:drop-shadow(0 0 5px #ffcf42);
  animation:arrow-flow .55s linear infinite;
}
@keyframes arrow-flow{to{stroke-dashoffset:-34}}
.arrow-head{fill:#ffe16a;filter:drop-shadow(0 0 5px #ffcf42)}
#arrow-dot{fill:#fff4b0;filter:drop-shadow(0 0 8px #ffe16a)}
.overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:20px;background:#0009;z-index:2000;
}
.overlay.show{display:flex}
.dialog{
  max-width:380px;width:100%;background:#112d20;
  border:1px solid #d8b75f;border-radius:13px;padding:24px;text-align:center;
  box-shadow:0 15px 55px #0008;
}
.dialog h2{margin-top:0;color:#f6d77e}
.dialog p{font:14px/1.6 Arial,sans-serif;color:#e0e9df}
.dialog .btn{margin-top:10px}
@media(max-width:500px){
  header{padding:10px;gap:9px}
  .stats{gap:10px}
  .btn{padding:8px 9px;font-size:11px}
  main{padding:12px 6px}
  .top-row{margin-bottom:18px}
  .card .corner{left:2px;top:3px}
  .card .corner.bottom{left:auto;right:2px;top:auto;bottom:3px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header>
  <div class="brand">SOLITAIRE<small>CLASSIC KLONDIKE</small></div>
  <div class="stats">
    <div>MOVES<strong id="moves">0</strong></div>
    <div>SCORE<strong id="score">0</strong></div>
    <div>TIME<strong id="timer">00:00</strong></div>
  </div>
  <div class="controls">
    <button class="btn" id="undo">↶ UNDO</button>
    <button class="btn" id="new-game">NEW GAME</button>
    <button class="btn help" id="help">💡 HELP</button>
  </div>
</header>

<main>
  <div class="status" id="status">Move cards in descending order, alternating red and black.</div>
  <div id="help-message"></div>
  <section class="table">
    <div class="top-row">
      <div class="top-left">
        <div class="stock" id="stock"></div>
        <div class="waste" id="waste"></div>
      </div>
      <div class="foundation-area">
        <div class="slot foundation" id="foundation-0" data-foundation="0"><span class="suit-mark">♠</span></div>
        <div class="slot foundation" id="foundation-1" data-foundation="1"><span class="suit-mark">♥</span></div>
        <div class="slot foundation" id="foundation-2" data-foundation="2"><span class="suit-mark">♣</span></div>
        <div class="slot foundation" id="foundation-3" data-foundation="3"><span class="suit-mark">♦</span></div>
      </div>
    </div>
    <div class="tableau" id="tableau"></div>
  </section>
</main>

<svg id="arrow-layer" aria-hidden="true">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="arrow-head"></path>
    </marker>
  </defs>
  <path id="help-arrow" class="arrow-line" marker-end="url(#arrowhead)" d="" style="display:none"></path>
  <circle id="arrow-dot" r="5" cx="0" cy="0" style="display:none"></circle>
</svg>

<div class="overlay" id="win-overlay">
  <div class="dialog">
    <h2>♛ You Won!</h2>
    <p>All 52 cards are home. Excellent game!</p>
    <button class="btn help" id="play-again">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
"use strict";

const suits = ["♠","♥","♣","♦"];
const suitNames = ["Spades","Hearts","Clubs","Diamonds"];
const redSuits = ["♥","♦"];
const faceSymbols = {11:"♛",12:"♚",13:"♔"};
const $ = id => document.getElementById(id);

let deck = [];
let stock = [];
let waste = [];
let foundations = [[],[],[],[]];
let tableau = [[],[],[],[],[],[],[]];
let selected = null;
let moves = 0;
let score = 0;
let seconds = 0;
let timerInterval = null;
let history = [];
let helpOn = false;
let currentHint = null;
let nextId = 1;

const tableauEl = $("tableau");
const stockEl = $("stock");
const wasteEl = $("waste");
const statusEl = $("status");
const helpMessage = $("help-message");
const arrow = $("help-arrow");
const arrowDot = $("arrow-dot");

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function makeDeck(){
  const cards=[];
  for(const suit of suits){
    for(let rank=1;rank<=13;rank++){
      cards.push({
        id:nextId++,suit,rank,faceUp:false
      });
    }
  }
  return shuffle(cards);
}
function rankText(rank){
  if(rank===1)return "A";
  if(rank===11)return "J";
  if(rank===12)return "Q";
  if(rank===13)return "K";
  return String(rank);
}
function isRed(card){return redSuits.includes(card.suit)}
function sameColor(a,b){return isRed(a)===isRed(b)}
function topOf(pile){return pile[pile.length-1]}
function setStatus(text){statusEl.textContent=text}
function formatTime(){
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  $("timer").textContent=m+":"+s;
}
function updateStats(){
  $("moves").textContent=moves;
  $("score").textContent=score;
  formatTime();
}
function cloneState(){
  return {
    stock:stock.map(c=>({...c})),
    waste:waste.map(c=>({...c})),
    foundations:foundations.map(p=>p.map(c=>({...c}))),
    tableau:tableau.map(p=>p.map(c=>({...c}))),
    moves,score,seconds
  };
}
function saveHistory(){
  history.push(cloneState());
  if(history.length>80)history.shift();
}
function restoreState(s){
  stock=s.stock.map(c=>({...c}));
  waste=s.waste.map(c=>({...c}));
  foundations=s.foundations.map(p=>p.map(c=>({...c})));
  tableau=s.tableau.map(p=>p.map(c=>({...c})));
  moves=s.moves;score=s.score;seconds=s.seconds;
  selected=null;
  clearHelp();
  render();
  updateStats();
  setStatus("Move undone.");
}
function undo(){
  if(!history.length){setStatus("Nothing to undo yet.");return}
  restoreState(history.pop());
}
function newGame(){
  clearInterval(timerInterval);
  nextId=1;
  deck=makeDeck();
  stock=[];waste=[];foundations=[[],[],[],[]];
  tableau=[[],[],[],[],[],[],[]];
  selected=null;moves=0;score=0;seconds=0;history=[];
  clearHelp();
  for(let col=0;col<7;col++){
    for(let i=0;i<=col;i++){
      const card=deck.pop();
      card.faceUp=(i===col);
      tableau[col].push(card);
    }
  }
  stock=deck;
  render();
  updateStats();
  setStatus("Game started. Build down in alternating colors; build foundations from Ace to King.");
  $("win-overlay").classList.remove("show");
  timerInterval=setInterval(()=>{
    seconds++;
    formatTime();
  },1000);
}
function createCard(card,location,index){
  const el=document.createElement("div");
  el.className="card"+(card.faceUp?(isRed(card)?" red":""):" back");
  el.id="card-"+card.id;
  el.dataset.cardId=card.id;
  el.dataset.location=location;
  el.dataset.index=index;
  if(card.faceUp){
    const corner=document.createElement("div");
    corner.className="corner";
    corner.innerHTML=`${rankText(card.rank)}<span class="suit">${card.suit}</span>`;
    const pip=document.createElement("div");
    if(card.rank>=11){
      pip.className="face-art";
      pip.innerHTML=`<span>${faceSymbols[card.rank]}<br>${card.suit}</span>`;
    }else{
      pip.className="pip";
      pip.textContent=card.rank===1?card.suit:card.suit;
    }
    const bottom=document.createElement("div");
    bottom.className="corner bottom";
    bottom.innerHTML=`${rankText(card.rank)}<span class="suit">${card.suit}</span>`;
    el.append(corner,pip,bottom);
  }
  if(location.startsWith("tableau-")){
    const col=Number(location.split("-")[1]);
    const pile=tableau[col];
    const previous=pile.slice(0,index).reduce((n,c)=>n+(c.faceUp?28:14),0);
    el.style.top=previous+"px";
    el.style.zIndex=String(index+1);
  }
  if(selected && selected.cardId===card.id)el.classList.add("selected");
  if(currentHint && currentHint.cardId===card.id)el.classList.add("hint-source");
  el.addEventListener("click",e=>{
    e.stopPropagation();
    handleCardClick(card.id,location,index);
  });
  el.addEventListener("dragstart",e=>{
    if(!card.faceUp){e.preventDefault();return}
    selectCard(card.id,location,index);
    e.dataTransfer.setData("text/plain",String(card.id));
    e.dataTransfer.effectAllowed="move";
  });
  el.draggable=card.faceUp;
  el.addEventListener("dragover",e=>e.preventDefault());
  el.addEventListener("drop",e=>{
    e.preventDefault();e.stopPropagation();
    const id=Number(e.dataTransfer.getData("text/plain"));
    if(id)tryDropOnCard(id,location,index);
  });
  return el;
}
function render(){
  stockEl.innerHTML="";
  wasteEl.innerHTML="";
  tableauEl.innerHTML="";
  for(let i=0;i<4;i++){
    const slot=$("foundation-"+i);
    slot.querySelectorAll(".card").forEach(c=>c.remove());
    slot.classList.toggle("hint-dest",!!(currentHint&&currentHint.targetId==="foundation-"+i));
    slot.onclick=()=>handleDestination({type:"foundation",index:i});
    slot.ondragover=e=>e.preventDefault();
    slot.ondrop=e=>{
      e.preventDefault();
      const id=Number(e.dataTransfer.getData("text/plain"));
      if(id){selectCardById(id);moveToFoundation(i)}
    };
    if(foundations[i].length){
      const c=topOf(foundations[i]);
      const el=createCard(c,"foundation-"+i,foundations[i].length-1);
      el.style.top="0";
      slot.appendChild(el);
    }
  }
  if(stock.length){
    const back=document.createElement("div");
    back.className="card back";
    back.style.top="0";
    back.title="Draw a card";
    stockEl.appendChild(back);
  }else{
    const empty=document.createElement("div");
    empty.className="slot";
    empty.style.width="var(--card-w)";
    empty.style.height="var(--card-h)";
    empty.style.display="grid";
    empty.style.placeItems="center";
    empty.style.color="#ffffff70";
    empty.style.fontSize="24px";
    empty.textContent="↻";
    stockEl.appendChild(empty);
  }
  stockEl.onclick=drawCard;
  if(waste.length){
    const c=topOf(waste);
    const el=createCard(c,"waste",waste.length-1);
    el.style.top="0";
    wasteEl.appendChild(el);
  }
  for(let col=0;col<7;col++){
    const pileEl=document.createElement("div");
    pileEl.className="pile";
    pileEl.id="tableau-pile-"+col;
    const hintTarget=currentHint&&currentHint.targetId==="tableau-slot-"+col;
    const slot=document.createElement("div");
    slot.className="slot"+(hintTarget?" hint-dest":"");
    slot.id="tableau-slot-"+col;
    if(!tableau[col].length){
      const mark=document.createElement("span");
      mark.className="suit-mark empty-king";
      mark.textContent="K";
      slot.appendChild(mark);
    }
    slot.onclick=()=>handleDestination({type:"tableau",index:col});
    slot.ondragover=e=>e.preventDefault();
    slot.ondrop=e=>{
      e.preventDefault();
      const id=Number(e.dataTransfer.getData("text/plain"));
      if(id){selectCardById(id);moveToTableau(col)}
    };
    pileEl.appendChild(slot);
    tableau[col].forEach((card,index)=>{
      const el=createCard(card,"tableau-"+col,index);
      pileEl.appendChild(el);
    });
    tableauEl.appendChild(pileEl);
  }
  if(currentHint){
    const target=$(currentHint.targetId);
    if(target)target.classList.add("hint-dest");
  }
  if(helpOn&&currentHint)requestAnimationFrame(drawHelpArrow);
}
function findCard(id){
  for(let i=0;i<waste.length;i++)if(waste[i].id===id)return {card:waste[i],type:"waste",index:i};
  for(let col=0;col<7;col++){
    for(let i=0;i<tableau[col].length;i++){
      if(tableau[col][i].id===id)return {card:tableau[col][i],type:"tableau",col,index:i};
    }
  }
  for(let i=0;i<4;i++){
    for(let j=0;j<foundations[i].length;j++){
      if(foundations[i][j].id===id)return {card:foundations[i][j],type:"foundation",col:i,index:j};
    }
  }
  return null;
}
function selectCardById(id){
  const found=findCard(id);
  if(!found)return;
  selectCard(id,found.type==="tableau"?"tableau-"+found.col:found.type,found.index);
}
function selectCard(id,location,index){
  const found=findCard(id);
  if(!found||!found.card.faceUp)return;
  if(found.type==="tableau"){
    const pile=tableau[found.col];
    if(pile.slice(found.index).some(c=>!c.faceUp))return;
  }
  if(found.type==="foundation" && found.index!==foundations[found.col].length-1)return;
  selected={cardId:id,from:found.type,col:found.col,index:found.index};
  clearHelp();
  render();
}
function handleCardClick(id,location,index){
  const found=findCard(id);
  if(!found)return;
  if(found.type==="tableau"&&!found.card.faceUp){
    const pile=tableau[found.col];
    if(index===pile.length-1){
      saveHistory();pile[index].faceUp=true;moves++;score+=5;
      selected=null;clearHelp();render();updateStats();
      setStatus("Card flipped!");return;
    }
    return;
  }
  if(selected){
    if(selected.cardId===id){selected=null;render();return}
    const target=found;
    if(target.type==="tableau"){moveToTableau(target.col);return}
    if(target.type==="foundation"){moveToFoundation(target.col);return}
    if(target.type==="waste"){
      if(selected.from==="tableau"||selected.from==="waste")selectCard(id,location,index);
      return;
    }
  }
  if(found.type==="waste"){
    selectCard(id,"waste",index);
  }else if(found.type==="tableau"){
    selectCard(id,location,index);
  }else if(found.type==="foundation"){
    if(found.index===foundations[found.col].length-1)selectCard(id,location,index);
  }
}
function handleDestination(target){
  if(!selected)return;
  if(target.type==="tableau")moveToTableau(target.index);
  else moveToFoundation(target.index);
}
function removeSelectedCards(){
  if(!selected)return [];
  if(selected.from==="waste"){
    if(!waste.length||topOf(waste).id!==selected.cardId)return [];
    return [waste.pop()];
  }
  if(selected.from==="tableau"){
    const pile=tableau[selected.col];
    if(!pile[selected.index]||pile[selected.index].id!==selected.cardId)return [];
    return pile.splice(selected.index);
  }
  if(selected.from==="foundation"){
    const pile=foundations[selected.col];
    if(selected.index!==pile.length-1)return [];
    return [pile.pop()];
  }
  return [];
}
function putBack(cards,from){
  if(from==="waste")waste.push(...cards);
  else if(from==="tableau")tableau[selected.col].push(...cards);
  else if(from==="foundation")foundations[selected.col].push(...cards);
}
function getSelectedCards(){
  if(!selected)return [];
  if(selected.from==="waste")return waste.filter(c=>c.id===selected.cardId);
  if(selected.from==="tableau")return tableau[selected.col].slice(selected.index);
  if(selected.from==="foundation")return [topOf(foundations[selected.col])].filter(Boolean);
  return [];
}
function validTableau(cards,targetCol){
  if(!cards.length)return false;
  const first=cards[0],pile=tableau[targetCol];
  if(!first.faceUp)return false;
  if(!pile.length)return first.rank===13;
  const top=topOf(pile);
  return top.faceUp&&top.rank===first.rank+1&&!sameColor(top,first);
}
function moveToTableau(col){
  if(!selected)return false;
  const cards=getSelectedCards();
  if(!validTableau(cards,col))return false;
  if(selected.from==="tableau"&&selected.col===col)return false;
  saveHistory();
  const oldFrom=selected.from,oldCol=selected.col;
  const moving=removeSelectedCards();
  if(!moving.length)return false;
  tableau[col].push(...moving);
  if(oldFrom==="tableau"&&tableau[oldCol].length&&!topOf(tableau[oldCol]).faceUp){
    topOf(tableau[oldCol]).faceUp=true;score+=5;
  }
  moves++;selected=null;clearHelp();render();updateStats();
  setStatus("Nice move! Build down in alternating colors.");
  checkWin();
  return true;
}
function foundationIndex(card){return suits.indexOf(card.suit)}
function canFoundation(card,index){
  const pile=foundations[index];
  if(foundationIndex(card)!==index)return false;
  if(!pile.length)return card.rank===1;
  return topOf(pile).rank===card.rank-1;
}
function moveToFoundation(index){
  if(!selected)return false;
  const cards=getSelectedCards();
  if(cards.length!==1||!canFoundation(cards[0],index))return false;
  if(selected.from==="foundation"&&selected.col===index)return false;
  saveHistory();
  const oldFrom=selected.from,oldCol=selected.col;
  const moving=removeSelectedCards();
  if(!moving.length)return false;
  foundations[index].push(moving[0]);
  if(oldFrom==="tableau"&&tableau[oldCol].length&&!topOf(tableau[oldCol]).faceUp){
    topOf(tableau[oldCol]).faceUp=true;score+=5;
  }
  score+=10;moves++;selected=null;clearHelp();render();updateStats();
  setStatus("Card moved to the foundation.");
  checkWin();
  return true;
}
function tryDropOnCard(id,location,index){
  if(!selected||selected.cardId!==id)selectCardById(id);
  const target=findCard(Number(id));
  if(!target)return;
  if(location.startsWith("tableau-")){
    const col=Number(location.split("-")[1]);
    if(selected&&selected.col===col&&selected.from==="tableau")return;
    moveToTableau(col);
  }else if(location.startsWith("foundation-")){
    moveToFoundation(Number(location.split("-")[1]));
  }
}
function drawCard(){
  if(stock.length){
    saveHistory();
    const c=stock.pop();c.faceUp=true;waste.push(c);
    moves++;selected=null;clearHelp();render();updateStats();
    setStatus("Drawn a card. Play it or draw another.");
  }else if(waste.length){
    saveHistory();
    stock=waste.reverse().map(c=>({...c,faceUp:false}));
    waste=[];moves++;score=Math.max(0,score-20);
    selected=null;clearHelp();render();updateStats();
    setStatus("Stock recycled. Draw again.");
  }else{
    setStatus("No cards left in the stock.");
  }
}
function checkWin(){
  if(foundations.every(p=>p.length===13)){
    clearInterval(timerInterval);
    $("win-overlay").classList.add("show");
    setStatus("All cards completed!");
  }
}
function clearHelp(){
  helpOn=false;currentHint=null;
  helpMessage.classList.remove("show");
  helpMessage.textContent="";
  arrow.style.display="none";arrow.setAttribute("d","");
  arrowDot.style.display="none";
  document.querySelectorAll(".hint-source,.hint-dest").forEach(el=>{
    el.classList.remove("hint-source","hint-dest");
  });
  $("help").textContent="💡 HELP";
}
function getCardLocation(card){
  for(let col=0;col<7;col++){
    const i=tableau[col].findIndex(c=>c.id===card.id);
    if(i>=0)return {type:"tableau",col,index:i};
  }
  if(waste.some(c=>c.id===card.id))return {type:"waste",index:waste.findIndex(c=>c.id===card.id)};
  return null;
}
function findHint(){
  const sources=[];
  if(waste.length)sources.push({card:topOf(waste),type:"waste",index:waste.length-1});
  for(let col=0;col<7;col++){
    const pile=tableau[col];
    if(!pile.length)continue;
    const top=topOf(pile);
    if(top.faceUp)sources.push({card:top,type:"tableau",col,index:pile.length-1});
    for(let i=0;i<pile.length;i++){
      if(pile[i].faceUp&&i<pile.length-1){
        if(pile.slice(i).every(c=>c.faceUp))sources.push({card:pile[i],type:"tableau",col,index:i});
      }
    }
  }
  // Priority 1: safe foundation moves.
  for(const s of sources){
    if(s.type==="tableau"&&s.index!==tableau[s.col].length-1)continue;
    const fi=foundationIndex(s.card);
    if(canFoundation(s.card,fi)){
      return {cardId:s.card.id,targetId:"foundation-"+fi,text:`Move the ${rankText(s.card.rank)} of ${suitNames[fi]} to its foundation. Follow the arrow.`};
    }
  }
  // Priority 2: move a card or a stack onto another tableau pile.
  for(const s of sources){
    for(let col=0;col<7;col++){
      if(s.type==="tableau"&&s.col===col)continue;
      if(validTableau(s.type==="tableau"?tableau[s.col].slice(s.index):[s.card],col)){
        const pile=tableau[col];
        const targetId=pile.length?"card-"+topOf(pile).id:"tableau-slot-"+col;
        return {cardId:s.card.id,targetId,text:`Move ${rankText(s.card.rank)}${s.card.suit} onto the highlighted pile. Follow the arrow.`};
      }
    }
  }
  // Priority 3: reveal a hidden card by moving a visible king or stack.
  for(let col=0;col<7;col++){
    const pile=tableau[col];
    if(!pile.length||topOf(pile).faceUp===false)continue;
    const s={card:topOf(pile),type:"tableau",col,index:pile.length-1};
    for(let target=0;target<7;target++){
      if(target===col)continue;
      if(validTableau([s.card],target)){
        return {cardId:s.card.id,targetId:tableau[target].length?"card-"+topOf(tableau[target]).id:"tableau-slot-"+target,text:"Move this card to help uncover more cards. Follow the arrow."};
      }
    }
  }
  // If no move is available, recommend drawing from stock.
  if(stock.length||waste.length){
    return {cardId:null,targetId:"stock",text:"No obvious move is available. Tap the stock pile to draw a card."};
  }
  return {cardId:null,targetId:null,text:"No moves found. Try UNDO or start a new game."};
}
function drawHelpArrow(){
  if(!helpOn||!currentHint)return;
  let sourceEl=currentHint.cardId?$("card-"+currentHint.cardId):null;
  let targetEl=$(currentHint.targetId);
  if(currentHint.targetId==="stock")targetEl=stockEl;
  if(!targetEl){
    arrow.style.display="none";arrowDot.style.display="none";return;
  }
  const tr=targetEl.getBoundingClientRect();
  const tx=tr.left+tr.width/2;
  const ty=tr.top+tr.height/2;
  let sx,sy;
  if(sourceEl){
    const sr=sourceEl.getBoundingClientRect();
    sx=sr.left+sr.width/2;sy=sr.top+Math.min(sr.height*.45,40);
  }else{
    sx=tx;sy=Math.max(25,ty-90);
  }
  const dx=tx-sx,dy=ty-sy;
  const dist=Math.hypot(dx,dy);
  const shorten=Math.min(22,dist*.12);
  const ex=tx-(dx/(dist||1))*shorten;
  const ey=ty-(dy/(dist||1))*shorten;
  const curve= Math.max(24,Math.min(90,Math.abs(dx)*.15));
  const midX=(sx+ex)/2;
  const midY=(sy+ey)/2-curve;
  arrow.setAttribute("d",`M ${sx} ${sy} Q ${midX} ${midY} ${ex} ${ey}`);
  arrow.style.display="block";
  arrowDot.setAttribute("cx",sx);
  arrowDot.setAttribute("cy",sy);
  arrowDot.style.display=sourceEl?"block":"none";
}
function showHelp(){
  if(helpOn){clearHelp();render();setStatus("Help turned off.");return}
  clearHelp();
  const hint=findHint();
  helpOn=true;currentHint=hint;
  $("help").textContent="✕ CLOSE HELP";
  helpMessage.textContent=hint.text;
  helpMessage.classList.add("show");
  render();
  requestAnimationFrame(drawHelpArrow);
  setStatus("Follow the glowing arrow to see your next move.");
}
$("undo").addEventListener("click",undo);
$("new-game").addEventListener("click",newGame);
$("play-again").addEventListener("click",newGame);
$("help").addEventListener("click",showHelp);
window.addEventListener("resize",()=>{if(helpOn)requestAnimationFrame(drawHelpArrow)});
window.addEventListener("scroll",()=>{if(helpOn)requestAnimationFrame(drawHelpArrow)},{passive:true});

newGame();
})();
</script>
