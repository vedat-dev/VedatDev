<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Dice</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #102b58 0%, #071a36 45%, #030d1e 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: min(720px, 96vw);
}

.title {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 14px;
}

.panel {
    position: relative;
    background: rgba(7, 24, 51, 0.95);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

/* SECRET COLOR CONTROL */

.secret-color {
    position: absolute;
    top: 9px;
    right: 12px;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: .22;
    cursor: pointer;
    user-select: none;
}

.secret-color:hover {
    opacity: .5;
}

/* DICE SECTION */

.dice-section {
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 18px 10px 16px;
}

.dice-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    flex-wrap: nowrap;
}

.dice-box {
    width: 76px;
    height: 76px;
    flex: 0 0 76px;
    border: 2px solid white;
    border-radius: 12px;
    position: relative;
    transition:
        background-color .15s,
        transform .15s,
        box-shadow .15s;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

.dice-box::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(255,255,255,.8);
}

.dice-box.rolling {
    animation: shake .13s infinite alternate;
}

@keyframes shake {
    from {
        transform: rotate(-4deg) scale(.96);
    }
    to {
        transform: rotate(4deg) scale(1.04);
    }
}

/* REROLL */

.reroll-wrap {
    display: flex;
    justify-content: center;
    margin-top: 17px;
}

.reroll {
    border: none;
    background: #ffe477;
    color: #101010;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 12px 30px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,228,119,.18);
    transition: .15s;
}

.reroll:active {
    transform: scale(.94);
}

.reroll:hover {
    background: #ffec9d;
}

.reroll:disabled {
    opacity: .55;
    cursor: default;
}

/* TOTAL ROLLS */

.stats-section {
    margin-top: 12px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 14px;
    text-align: center;
}

.stats-title {
    font-size: 10px;
    color: #8fa9ca;
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 5px;
}

.total-rolls {
    font-size: 26px;
    font-weight: 900;
}

/* HISTORY */

.history-section {
    margin-top: 12px;
    background: rgba(0,0,0,.16);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 15px;
}

.history-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 900;
    margin-bottom: 12px;
    color: #dceaff;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 3px;
}

.history::-webkit-scrollbar {
    width: 4px;
}

.history::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.2);
    border-radius: 10px;
}

.history-empty {
    text-align: center;
    color: #637b9d;
    font-size: 11px;
    padding: 10px;
}

.history-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px;
    padding: 8px;
}

.history-number {
    width: 24px;
    font-size: 9px;
    color: #7189aa;
    font-weight: 800;
}

.history-box {
    width: 38px;
    height: 38px;
    border: 1.5px solid white;
    border-radius: 7px;
    position: relative;
}

.history-box::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* MOBILE */

@media (max-width: 430px) {
    body {
        padding: 12px;
    }

    .panel {
        padding: 15px 9px;
    }

    .title {
        font-size: 26px;
    }

    .dice-grid {
        gap: 6px;
    }

    .dice-box {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
    }
}

@media (max-width: 340px) {
    .dice-grid {
        gap: 4px;
    }

    .dice-box {
        width: 61px;
        height: 61px;
        flex-basis: 61px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">ONLINE DICE</div>

    <div class="panel">

        <!-- Tiny secret color control -->
        <div class="secret-color" id="secretControl">
            COLOR: <span id="secretColor">GREEN</span>
        </div>

        <!-- DICE + REROLL -->
        <div class="dice-section">

            <div class="dice-grid">
                <div class="dice-box" id="dice1"></div>
                <div class="dice-box" id="dice2"></div>
                <div class="dice-box" id="dice3"></div>
                <div class="dice-box" id="dice4"></div>
            </div>

            <div class="reroll-wrap">
                <button class="reroll" id="rerollBtn">
                    REROLL
                </button>
            </div>

        </div>

        <!-- TOTAL ROLLS -->
        <div class="stats-section">
            <div class="stats-title">TOTAL ROLLS</div>
            <div class="total-rolls" id="totalRolls">0</div>
        </div>

        <!-- REROLL HISTORY -->
        <div class="history-section">

            <div class="history-title">
                REROLL HISTORY
            </div>

            <div class="history" id="history">
                <div class="history-empty" id="historyEmpty">
                    No rolls yet
                </div>
            </div>

        </div>

    </div>
</div>

<script>

const colors = [
    {
        name: "GREEN",
        hex: "#22c55e"
    },
    {
        name: "BLUE",
        hex: "#3b82f6"
    },
    {
        name: "YELLOW",
        hex: "#eab308"
    },
    {
        name: "ORANGE",
        hex: "#f97316"
    },
    {
        name: "PURPLE",
        hex: "#a855f7"
    },
    {
        name: "RED",
        hex: "#ef4444"
    }
];

const dice = [
    document.getElementById("dice1"),
    document.getElementById("dice2"),
    document.getElementById("dice3"),
    document.getElementById("dice4")
];

const rerollBtn = document.getElementById("rerollBtn");
const totalRollsElement = document.getElementById("totalRolls");
const historyElement = document.getElementById("history");
const historyEmpty = document.getElementById("historyEmpty");

const secretControl = document.getElementById("secretControl");
const secretColorElement = document.getElementById("secretColor");

let secretIndex = 0;
let totalRolls = 0;
let rolling = false;

/* Change secret/excluded color */

secretControl.addEventListener("click", () => {

    secretIndex++;

    if (secretIndex >= colors.length) {
        secretIndex = 0;
    }

    secretColorElement.textContent =
        colors[secretIndex].name;

});

/* Get a random color excluding secret color */

function getRandomColor() {

    const availableColors =
        colors.filter((color, index) => index !== secretIndex);

    return availableColors[
        Math.floor(Math.random() * availableColors.length)
    ];
}

/* Set dice color */

function setDiceColor(die, color) {

    die.style.backgroundColor = color.hex;
}

/* Reroll */

rerollBtn.addEventListener("click", () => {

    if (rolling) return;

    rolling = true;
    rerollBtn.disabled = true;

    dice.forEach(die => {
        die.classList.add("rolling");
    });

    let animationTime = 0;

    const animation = setInterval(() => {

        dice.forEach(die => {
            const randomColor = getRandomColor();
            setDiceColor(die, randomColor);
        });

        animationTime += 100;

        if (animationTime >= 900) {

            clearInterval(animation);

            finishRoll();
        }

    }, 100);
});

/* Finish roll */

function finishRoll() {

    dice.forEach(die => {
        die.classList.remove("rolling");
    });

    const results = [];

    dice.forEach(die => {

        const color = getRandomColor();

        setDiceColor(die, color);

        results.push(color);
    });

    totalRolls++;

    totalRollsElement.textContent = totalRolls;

    addHistory(results);

    rolling = false;
    rerollBtn.disabled = false;
}

/* Add result to history */

function addHistory(results) {

    if (historyEmpty) {
        historyEmpty.remove();
    }

    const row = document.createElement("div");
    row.className = "history-row";

    const number = document.createElement("div");
    number.className = "history-number";
    number.textContent = "#" + totalRolls;

    row.appendChild(number);

    results.forEach(color => {

        const box = document.createElement("div");

        box.className = "history-box";

        box.style.backgroundColor = color.hex;

        row.appendChild(box);
    });

    historyElement.prepend(row);
}

/* Starting dice */

dice.forEach(die => {

    const color = getRandomColor();

    setDiceColor(die, color);

});

</script>

</body>
</html>
