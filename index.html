<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Catalog & Ratings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BLOCKY BUTTON NAVIGATION */
    .nav-container {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 28px;
    }

    .btn-blocky {
      flex: 1;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      border: 4px solid #000000;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
      font-family: inherit;
    }

    .btn-sounds {
      background-color: #6366f1;
      box-shadow: 0px 6px 0px #000000;
    }

    .btn-sounds:hover {
      background-color: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0px 8px 0px #000000;
    }

    .btn-sounds:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #000000;
    }

    .btn-future {
      background-color: #334155;
      color: #94a3b8;
      box-shadow: 0px 6px 0px #000000;
    }

    .btn-future:hover {
      background-color: #475569;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0px 8px 0px #000000;
    }

    .btn-future:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #000000;
    }

    /* CATALOG & CARDS */
    .catalog {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: #161b22;
      border: 3px solid #000000;
      border-radius: 8px;
      box-shadow: 0px 5px 0px #000000;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .title-area h3 {
      font-size: 18px;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .id-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #0d1117;
      border: 2px solid #000000;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .id-code {
      font-family: monospace;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* BLOCKY BUTTONS */
    .btn-action {
      background-color: #38bdf8;
      color: #000000;
      border: 2px solid #000000;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0px 3px 0px #000000;
      transition: all 0.05s ease;
    }

    .btn-action:hover {
      background-color: #7dd3fc;
    }

    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 0px #000000;
    }

    /* INTERACTIVE LIKE BUTTON */
    .btn-like {
      background-color: #22c55e;
      color: #000000;
      border: 2px solid #000000;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0px 3px 0px #000000;
      transition: all 0.05s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-like:hover {
      background-color: #4ade80;
    }

    .btn-like:active {
      transform: translateY(2px);
      box-shadow: 0px 1px 0px #000000;
    }

    .btn-like.liked {
      background-color: #15803d;
      color: #ffffff;
    }

    /* SOUND PLAYER & TRACK SCRUBBER */
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0d1117;
      border: 2px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .scrubber {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* STAR RATINGS */
    .rating-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #21262d;
      padding-top: 10px;
    }

    .stars {
      display: flex;
      gap: 4px;
    }

    .star {
      font-size: 22px;
      color: #30363d;
      cursor: pointer;
      transition: color 0.1s ease;
    }

    .star.active {
      color: #facc15;
    }

    .rating-text {
      font-size: 13px;
      color: #8b949e;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <button class="btn-blocky btn-sounds">Sounds</button>
    <button class="btn-blocky btn-future">Coming Soon</button>
  </div>

  <div class="catalog" id="soundCatalog"></div>

  <script>
    // Audio links pointing directly to clean CDN streams
    const sounds = [
      { name: "Morning Mood", id: "1846088038", likes: 1239620, src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73188.mp3" },
      { name: "The Four Seasons - Spring", id: "9045766074", likes: 1153562, src: "https://cdn.pixabay.com/download/audio/2021/08/09/audio_a163155d94.mp3" },
      { name: "Classic Beat", id: "1836009208", likes: 1069720, src: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3" },
      { name: "Science Mysteries", id: "1840776993", likes: 926481, src: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_c2a632e85a.mp3" },
      { name: "Crab Rave Style", id: "5410086218", likes: 856453, src: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" },
      { name: "Paradise Falls", id: "1837879082", likes: 698026, src: "https://cdn.pixabay.com/download/audio/2022/01/26/audio_d0c6af3011.mp3" },
      { name: "Elevator Music", id: "1841647093", likes: 653594, src: "https://cdn.pixabay.com/download/audio/2021/09/06/audio_138b301c23.mp3" },
      { name: "Chill Jazz", id: "1845341094", likes: 551422, src: "https://cdn.pixabay.com/download/audio/2022/08/02/audio_884fe92db1.mp3" },
      { name: "Horror Ambience", id: "9039981149", likes: 502203, src: "https://cdn.pixabay.com/download/audio/2022/03/24/audio_3d16298e72.mp3" },
      { name: "Cool Vibes", id: "1840684529", likes: 502200, src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_2d8159c771.mp3" },
      { name: "Gymnopedie No. 1", id: "9045766377", likes: 446140, src: "https://cdn.pixabay.com/download/audio/2021/11/25/audio_2492160d2b.mp3" },
      { name: "Night Run", id: "9044545570", likes: 349678, src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_136a5369c6.mp3" },
      { name: "Lo-fi Chill", id: "9043887091", likes: 338868, src: "https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3" },
      { name: "Bass Drop", id: "16190782181", likes: 329074, src: "https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c3f587.mp3" },
      { name: "Electronic Dance", id: "5409360995", likes: 296043, src: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_51197825b5.mp3" },
      { name: "Into The Forest", id: "1845497774", likes: 282630, src: "https://cdn.pixabay.com/download/audio/2022/03/23/audio_017b8f0bc2.mp3" },
      { name: "Happy Melody", id: "1843404009", likes: 250354, src: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_73145465d6.mp3" },
      { name: "Bossa Nova", id: "1837768517", likes: 238423, src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_b287ff553a.mp3" },
      { name: "Acoustic Stray", id: "120102995443063", likes: 229631, src: "https://cdn.pixabay.com/download/audio/2022/02/07/audio_651a70c3a2.mp3" }
    ];

    const container = document.getElementById('soundCatalog');
    let currentAudio = null;
    let currentPlayBtn = null;

    sounds.forEach((sound, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-header">
          <div class="title-area">
            <h3>${sound.name}</h3>
            <button class="btn-like" id="like-btn-${index}" onclick="toggleLike(${index})">
              👍 <span id="likes-count-${index}">${sound.likes.toLocaleString()}</span>
            </button>
          </div>
          <div class="id-box">
            <span class="id-code">${sound.id}</span>
            <button class="btn-action" onclick="copyId('${sound.id}', this)">Copy</button>
          </div>
        </div>

        <div class="player-row">
          <button class="btn-action play-btn" id="play-btn-${index}" onclick="toggleAudio(${index})">▶ Play</button>
          <input type="range" class="scrubber" id="scrubber-${index}" value="0" min="0" max="100" oninput="seekAudio(${index}, this.value)">
          <audio id="audio-${index}" src="${sound.src}" preload="none"></audio>
        </div>

        <div class="rating-row">
          <div class="stars" id="stars-${index}">
            ${[1, 2, 3, 4, 5].map(star => `<span class="star" onclick="rate(${index}, ${star})">&#9733;</span>`).join('')}
          </div>
          <span class="rating-text" id="rating-text-${index}">Rating: Unrated</span>
        </div>
      `;
      container.appendChild(card);

      const audio = card.querySelector(`#audio-${index}`);
      const scrubber = card.querySelector(`#scrubber-${index}`);

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          scrubber.value = (audio.currentTime / audio.duration) * 100;
        }
      });

      audio.addEventListener('ended', () => {
        const playBtn = card.querySelector('.play-btn');
        playBtn.innerText = "▶ Play";
        scrubber.value = 0;
      });
    });

    const userLikes = {};

    function toggleLike(index) {
      const sound = sounds[index];
      const countEl = document.getElementById(`likes-count-${index}`);
      const btnEl = document.getElementById(`like-btn-${index}`);

      if (!userLikes[index]) {
        userLikes[index] = true;
        sound.likes += 1;
        btnEl.classList.add('liked');
      } else {
        userLikes[index] = false;
        sound.likes -= 1;
        btnEl.classList.remove('liked');
      }

      countEl.innerText = sound.likes.toLocaleString();
    }

    function toggleAudio(index) {
      const audio = document.getElementById(`audio-${index}`);
      const btn = document.getElementById(`play-btn-${index}`);

      if (currentAudio && currentAudio !== audio) {
        currentAudio.pause();
        if (currentPlayBtn) currentPlayBtn.innerText = "▶ Play";
      }

      if (audio.paused) {
        audio.play().then(() => {
          btn.innerText = "⏸ Pause";
          currentAudio = audio;
          currentPlayBtn = btn;
        }).catch(err => console.log("Playback interrupted"));
      } else {
        audio.pause();
        btn.innerText = "▶ Play";
      }
    }

    function seekAudio(index, percent) {
      const audio = document.getElementById(`audio-${index}`);
      if (audio.duration) {
        audio.currentTime = (percent / 100) * audio.duration;
      }
    }

    function rate(soundIndex, rating) {
      const starContainer = document.getElementById(`stars-${soundIndex}`);
      const stars = starContainer.querySelectorAll('.star');
      
      stars.forEach((star, idx) => {
        if (idx < rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });

      document.getElementById(`rating-text-${soundIndex}`).innerText = `Your Rating: ${rating}/5`;
    }

    function copyId(id, btn) {
      navigator.clipboard.writeText(id);
      btn.innerText = "Copied!";
      setTimeout(() => {
        btn.innerText = "Copy";
      }, 1500);
    }
  </script>
</body>
</html>
