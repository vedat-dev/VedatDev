<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Catalog & Ratings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 0%, #1a1f2e 0%, #0a0e14 60%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px 14px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .page-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 13px;
    color: #7b8494;
    margin-bottom: 20px;
  }

  .nav-container {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 22px;
  }

  .btn-blocky {
    flex: 1;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    font-family: inherit;
  }
  .btn-sounds {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 4px 14px rgba(99,102,241,0.45);
  }
  .btn-sounds:active { transform: scale(0.97); }
  .btn-future {
    background: #1b2130;
    color: #6b7280;
    border: 1px solid #2a3141;
  }
  .btn-future:hover { color: #9ca3af; }

  .catalog {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: #131824;
    border: 1px solid #232a3a;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.2s ease;
  }
  .card:hover { border-color: #333d54; }
  .card.playing { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8 inset; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .title-area { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .cover {
    width: 42px; height: 42px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .title-text h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }
  .id-code {
    font-family: monospace;
    font-size: 11px;
    color: #5b6577;
    margin-top: 2px;
  }

  .btn-like {
    background: #1b2130;
    color: #9ca3af;
    border: 1px solid #2a3141;
    padding: 6px 10px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .btn-like:hover { border-color: #3b4254; }
  .btn-like:active { transform: scale(0.94); }
  .btn-like.liked {
    background: rgba(34,197,94,0.15);
    color: #4ade80;
    border-color: rgba(74,222,128,0.4);
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0d1117;
    border: 1px solid #1e2532;
    padding: 8px 10px;
    border-radius: 12px;
  }

  .play-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #05070c;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }
  .play-btn:active { transform: scale(0.9); }

  .scrub-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }

  .scrubber {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #232a3a;
    cursor: pointer;
  }
  .scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #38bdf8;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #5b6577;
    font-variant-numeric: tabular-nums;
  }

  .copy-btn {
    background: none;
    border: 1px solid #2a3141;
    color: #7b8494;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: #f1f5f9; border-color: #3b4254; }

  .rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #1e2532;
    padding-top: 10px;
  }

  .stars { display: flex; gap: 3px; }
  .star {
    font-size: 20px;
    color: #2a3141;
    cursor: pointer;
    transition: color 0.1s ease, transform 0.1s ease;
  }
  .star:hover { transform: scale(1.15); }
  .star.active { color: #facc15; }

  .rating-text { font-size: 12px; color: #7b8494; font-weight: 500; }
</style>
</head>
<body>

  <div class="page-title">🎧 Sound Catalog</div>
  <div class="page-sub">Tap play to preview, rate your favorites</div>

  <div class="nav-container">
    <button class="btn-blocky btn-sounds">Sounds</button>
    <button class="btn-blocky btn-future">Coming Soon</button>
  </div>

  <div class="catalog" id="soundCatalog"></div>

  <script>
    // Stable, hotlink-friendly demo audio (Pixabay's /download/ links are session-based
    // and get blocked when embedded directly — swapped for a reliable open CDN).
    const demoTracks = [
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
      "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    ];

    const covers = ["🎹","🎻","🥁","🔬","🦀","🌊","🛗","🎷","👻","✨","🕊️","🌙","☕","🔊","⚡","🌲","😊","🍹","🎸"];
    const gradients = [
      "linear-gradient(135deg,#6366f1,#8b5cf6)","linear-gradient(135deg,#38bdf8,#6366f1)",
      "linear-gradient(135deg,#f472b6,#fb923c)","linear-gradient(135deg,#22c55e,#38bdf8)",
      "linear-gradient(135deg,#facc15,#f97316)"
    ];

    const sounds = [
      { name: "Morning Mood", id: "1846088038", likes: 1239620 },
      { name: "The Four Seasons - Spring", id: "9045766074", likes: 1153562 },
      { name: "Classic Beat", id: "1836009208", likes: 1069720 },
      { name: "Science Mysteries", id: "1840776993", likes: 926481 },
      { name: "Crab Rave Style", id: "5410086218", likes: 856453 },
      { name: "Paradise Falls", id: "1837879082", likes: 698026 },
      { name: "Elevator Music", id: "1841647093", likes: 653594 },
      { name: "Chill Jazz", id: "1845341094", likes: 551422 },
      { name: "Horror Ambience", id: "9039981149", likes: 502203 },
      { name: "Cool Vibes", id: "1840684529", likes: 502200 },
      { name: "Gymnopedie No. 1", id: "9045766377", likes: 446140 },
      { name: "Night Run", id: "9044545570", likes: 349678 },
      { name: "Lo-fi Chill", id: "9043887091", likes: 338868 },
      { name: "Bass Drop", id: "16190782181", likes: 329074 },
      { name: "Electronic Dance", id: "5409360995", likes: 296043 },
      { name: "Into The Forest", id: "1845497774", likes: 282630 },
      { name: "Happy Melody", id: "1843404009", likes: 250354 },
      { name: "Bossa Nova", id: "1837768517", likes: 238423 },
      { name: "Acoustic Stray", id: "120102995443063", likes: 229631 }
    ].map((s, i) => ({ ...s, src: demoTracks[i % demoTracks.length] }));

    const container = document.getElementById('soundCatalog');
    let currentAudio = null;
    let currentCard = null;
    let currentBtn = null;

    function fmtTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    sounds.forEach((sound, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      const grad = gradients[index % gradients.length];
      const icon = covers[index % covers.length];

      card.innerHTML = `
        <div class="card-header">
          <div class="title-area">
            <div class="cover" style="background:${grad}">${icon}</div>
            <div class="title-text">
              <h3>${sound.name}</h3>
              <div class="id-code">${sound.id}</div>
            </div>
          </div>
          <button class="btn-like" id="like-btn-${index}" onclick="toggleLike(${index})">
            ♥ <span id="likes-count-${index}">${sound.likes.toLocaleString()}</span>
          </button>
        </div>

        <div class="player-row">
          <button class="play-btn" id="play-btn-${index}" onclick="toggleAudio(${index})">▶</button>
          <div class="scrub-wrap">
            <input type="range" class="scrubber" id="scrubber-${index}" value="0" min="0" max="100" oninput="seekAudio(${index}, this.value)">
            <div class="time-row">
              <span id="cur-time-${index}">0:00</span>
              <span id="dur-time-${index}">0:00</span>
            </div>
          </div>
          <button class="copy-btn" onclick="copyId('${sound.id}', this)">Copy ID</button>
          <audio id="audio-${index}" src="${sound.src}" preload="none"></audio>
        </div>

        <div class="rating-row">
          <div class="stars" id="stars-${index}">
            ${[1,2,3,4,5].map(star => `<span class="star" onclick="rate(${index}, ${star})">&#9733;</span>`).join('')}
          </div>
          <span class="rating-text" id="rating-text-${index}">Unrated</span>
        </div>
      `;
      container.appendChild(card);

      const audio = card.querySelector(`#audio-${index}`);
      const scrubber = card.querySelector(`#scrubber-${index}`);
      const curTime = card.querySelector(`#cur-time-${index}`);
      const durTime = card.querySelector(`#dur-time-${index}`);

      audio.addEventListener('loadedmetadata', () => {
        durTime.innerText = fmtTime(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          scrubber.value = (audio.currentTime / audio.duration) * 100;
          curTime.innerText = fmtTime(audio.currentTime);
        }
      });

      audio.addEventListener('ended', () => {
        document.getElementById(`play-btn-${index}`).innerText = "▶";
        scrubber.value = 0;
        curTime.innerText = "0:00";
        card.classList.remove('playing');
      });

      audio.addEventListener('error', () => {
        document.getElementById(`play-btn-${index}`).innerText = "⚠";
        curTime.innerText = "error";
      });
    });

    const userLikes = {};

    function toggleLike(index) {
      const sound = sounds[index];
      const countEl = document.getElementById(`likes-count-${index}`);
      const btnEl = document.getElementById(`like-btn-${index}`);

      userLikes[index] = !userLikes[index];
      sound.likes += userLikes[index] ? 1 : -1;
      btnEl.classList.toggle('liked', userLikes[index]);
      countEl.innerText = sound.likes.toLocaleString();
    }

    function toggleAudio(index) {
      const audio = document.getElementById(`audio-${index}`);
      const btn = document.getElementById(`play-btn-${index}`);
      const card = audio.closest('.card');

      if (currentAudio && currentAudio !== audio) {
        currentAudio.pause();
        if (currentBtn) currentBtn.innerText = "▶";
        if (currentCard) currentCard.classList.remove('playing');
      }

      if (audio.paused) {
        audio.play().then(() => {
          btn.innerText = "⏸";
          card.classList.add('playing');
          currentAudio = audio;
          currentBtn = btn;
          currentCard = card;
        }).catch(() => { btn.innerText = "⚠"; });
      } else {
        audio.pause();
        btn.innerText = "▶";
        card.classList.remove('playing');
      }
    }

    function seekAudio(index, percent) {
      const audio = document.getElementById(`audio-${index}`);
      if (audio.duration) {
        audio.currentTime = (percent / 100) * audio.duration;
      }
    }

    function rate(soundIndex, rating) {
      const stars = document.getElementById(`stars-${soundIndex}`).querySelectorAll('.star');
      stars.forEach((star, idx) => star.classList.toggle('active', idx < rating));
      document.getElementById(`rating-text-${soundIndex}`).innerText = `${rating}/5`;
    }

    function copyId(id, btn) {
      navigator.clipboard.writeText(id);
      const original = btn.innerText;
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = original; }, 1200);
    }
  </script>
</body>
</html>
